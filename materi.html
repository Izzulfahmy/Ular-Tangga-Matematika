<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Materi - Siklus Hidup yang Menakjubkan</title>
  
  <!-- Favicon Logo UNEJ -->
  <link rel="icon" type="image/png" href="aset/logo/unej.png" />
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* Reset & Layar Penuh (No Scroll) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Container Canva Embed Screen-Fit */
    .canva-embed-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      border: none;
    }

    .canva-embed-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Styling Tombol Aksi Floating Glassmorphism */
    .nav-btn {
      position: absolute;
      top: 24px;
      z-index: 20;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #047857;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .nav-btn:hover {
      transform: scale(1.12) rotate(6deg);
      background: #ffffff;
      color: #10b981;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    /* Posisi Spesifik Tombol */
    .home-btn {
      left: 24px;
    }

    .fullscreen-btn {
      right: 24px;
    }

    /* Responsive Breakpoint Mobile */
    @media (max-height: 700px), (max-width: 480px) {
      .nav-btn {
        top: 16px;
        width: 42px;
        height: 42px;
      }
      .nav-btn svg {
        width: 20px;
        height: 20px;
      }
      .home-btn { left: 16px; }
      .fullscreen-btn { right: 16px; }
    }
  </style>
</head>
<body>

  <!-- Tombol Home / Rumah (Tautan Ke Beranda Utama Repositori) -->
  <a href="https://izzulfahmy.github.io/Ular-Tangga-Matematika/" class="nav-btn home-btn" title="Kembali ke Beranda" onclick="playClickSound(event, this.href)">
    <svg viewBox="0 0 24 24">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </a>

  <!-- Tombol Fullscreen Icon SVG (Pojok Kanan Atas) -->
  <button class="nav-btn fullscreen-btn" id="fsBtn" title="Layar Penuh" onclick="toggleFullScreen()">
    <svg id="fsIcon" viewBox="0 0 24 24">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
  </button>

  <!-- Container Embed Canva PPT Full Screen -->
  <div class="canva-embed-container">
    <iframe loading="lazy" src="https://www.canva.com/design/DAHVDRpj6kI/8GbnjjdWzKv45lK9ZJYu9Q/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
  </div>

  <!-- Audio Synthesizer & Dynamic Logic Script -->
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playPopSound() {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playClickSound(event, targetUrl) {
      event.preventDefault();
      playPopSound();
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 180);
    }

    /* Logic Toggle Fullscreen + Dynamic SVG Switch */
    function toggleFullScreen() {
      playPopSound();
      const fsBtn = document.getElementById('fsBtn');
      const fsIcon = document.getElementById('fsIcon');
      
      const enterPath = 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
      const exitPath = 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';

      if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.msRequestFullscreen) {
          document.documentElement.msRequestFullscreen();
        } else if (document.documentElement.mozRequestFullScreen) {
          document.documentElement.mozRequestFullScreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
        }
        fsIcon.querySelector('path').setAttribute('d', exitPath);
        fsBtn.title = "Keluar Layar Penuh";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        fsIcon.querySelector('path').setAttribute('d', enterPath);
        fsBtn.title = "Layar Penuh";
      }
    }

    // Hover Sound Effect
    document.querySelectorAll('.nav-btn').forEach(card => {
      card.addEventListener('mouseenter', () => {
        initAudio();
        if (audioCtx && audioCtx.state === 'running') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.06);
        }
      });
    });
  </script>
</body>
</html>
