<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Materi - Siklus Hidup yang Menakjubkan</title>
  
  <!-- Favicon Logo UNEJ -->
  <link rel="icon" type="image/png" href="aset/logo/unej.png" />
  
  <!-- Google Fonts: Plus Jakarta Sans & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti Library untuk Perayaan Meriah -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Nunito', sans-serif;
    }

    /* Container Canva Embed Screen-Fit */
    .canva-embed-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      border: none;
    }

    .canva-embed-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Styling Tombol Aksi Floating Glassmorphism */
    .nav-btn {
      position: absolute;
      top: 24px;
      z-index: 20;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #047857;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .nav-btn:hover {
      transform: scale(1.12) rotate(6deg);
      background: #ffffff;
      color: #10b981;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    .home-btn { left: 24px; }
    .fullscreen-btn { right: 24px; }
    .quiz-btn { right: 86px; }

    /* FULLSCREEN GAME SCREEN (NO OVERLAY) */
    #fullscreenQuizApp {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #064e3b 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: scale(0.95);
    }

    #fullscreenQuizApp.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Canvas Garis Menjodohkan */
    #matchCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .match-node {
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .match-node:hover {
      transform: scale(1.05);
    }

    .match-node.selected {
      box-shadow: 0 0 0 4px #f59e0b;
    }

    .match-node.matched {
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes partyPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.15) rotate(8deg); }
    }
    .party-anim { animation: partyPulse 1.2s infinite ease-in-out; }

    @media (max-height: 700px), (max-width: 480px) {
      .nav-btn { top: 16px; width: 42px; height: 42px; }
      .nav-btn svg { width: 20px; height: 20px; }
      .home-btn { left: 16px; }
      .fullscreen-btn { right: 16px; }
      .quiz-btn { right: 68px; }
    }
  </style>
</head>
<body class="antialiased">

  <!-- Tombol Home -->
  <a href="https://izzulfahmy.github.io/Ular-Tangga-Matematika/" class="nav-btn home-btn" title="Kembali ke Beranda" onclick="playClickSound(event, this.href)">
    <svg viewBox="0 0 24 24">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </a>

  <!-- Tombol Gamepad / Latihan Soal Interaktif -->
  <button class="nav-btn quiz-btn" id="quizBtn" title="Latihan Soal Interaktif Fullscreen" onclick="openFullscreenQuiz()">
    <svg viewBox="0 0 24 24">
      <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H9v2H7v-2H5v-2h2V9h2v2h2v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
    </svg>
  </button>

  <!-- Tombol Fullscreen Icon SVG -->
  <button class="nav-btn fullscreen-btn" id="fsBtn" title="Layar Penuh" onclick="toggleFullScreen()">
    <svg id="fsIcon" viewBox="0 0 24 24">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
  </button>

  <!-- Container Embed Canva PPT Full Screen -->
  <div class="canva-embed-container">
    <iframe loading="lazy" src="https://www.canva.com/design/DAHVDRpj6kI/8GbnjjdWzKv45lK9ZJYu9Q/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
  </div>

  <!-- MODAL FULLSCREEN LATIHAN SOAL INTERAKTIF (FULLSCREEN APP UI) -->
  <div id="fullscreenQuizApp">
    
    <!-- Top Bar Navigation -->
    <div class="flex items-center justify-between border-b border-slate-700/80 pb-3">
      <div class="flex items-center gap-3">
        <div class="text-3xl bg-emerald-500/20 p-2 rounded-2xl border border-emerald-500/30">🎮</div>
        <div>
          <h2 id="appQuizTitle" class="text-lg sm:text-2xl font-black text-white font-jakarta">Latihan Interaktif Daur Hidup</h2>
          <p id="appQuizSubtitle" class="text-xs text-slate-400 font-bold uppercase tracking-widest">Soal 1 Dari 3</p>
        </div>
      </div>
      <button onclick="closeFullscreenQuiz()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-2xl text-xs sm:text-sm font-black transition-all shadow-md flex items-center gap-2">
        <span>Tutup Latihan</span>
        <span class="text-base">✕</span>
      </button>
    </div>

    <!-- Main Dynamic Content Area -->
    <div class="my-auto w-full max-w-4xl mx-auto relative flex flex-col items-center justify-center p-2">
      <canvas id="matchCanvas"></canvas>
      <div id="quizStageContainer" class="w-full"></div>
    </div>

    <!-- Bottom Actions Bar -->
    <div class="border-t border-slate-800 pt-3 flex items-center justify-between gap-4">
      <div id="appFeedback" class="text-sm font-black text-amber-400">Pilih dan jawab soal dengan benar!</div>
      <div class="flex items-center gap-2">
        <button onclick="resetCurrentQuiz()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-black rounded-xl text-xs sm:text-sm transition-all border border-slate-700">Ulangi</button>
        <button onclick="checkAnswer()" id="btnCheckAnswer" class="px-8 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs sm:text-sm transition-all shadow-lg uppercase tracking-wider">Periksa Jawaban</button>
      </div>
    </div>

    <!-- PERAYAAN KEMBANG API & CONFETTI 1 LAYAR FIT -->
    <div id="celebrationOverlay" class="fixed inset-0 z-[1000] bg-slate-950/90 backdrop-blur-md hidden flex flex-col justify-center items-center p-4 text-center">
      <div class="max-w-md w-full flex flex-col items-center bg-gradient-to-b from-amber-400 via-amber-500 to-amber-600 p-8 rounded-[3rem] border-8 border-yellow-200 shadow-2xl relative">
        <div class="text-6xl party-anim mb-3">🎉</div>
        <h2 class="text-3xl font-black text-slate-950 mb-2 font-jakarta uppercase tracking-wide">LUAR BIASA!</h2>
        <p id="celebrationMsg" class="text-lg font-bold text-slate-900 mb-6 leading-snug">Kamu berhasil menyelesaikan latihan dengan sempurna!</p>
        <button onclick="nextQuizOrClose()" id="btnNextQuiz" class="px-8 py-3.5 bg-slate-950 hover:bg-slate-900 text-amber-300 font-black rounded-2xl border-2 border-yellow-300 shadow-xl transition-all text-sm uppercase tracking-wider">Lanjut Soal Berikutnya 🚀</button>
      </div>
    </div>

  </div>

  <!-- Audio Synthesizer & Dynamic Logic Script -->
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPopSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playSound(type) {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        if (type === 'correct') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.2, now + i * 0.08); gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.2);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now); osc.frequency.linearRampToValueAtTime(110, now + 0.3);
          gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
        }
      } catch (e) {}
    }

    function playClickSound(event, targetUrl) {
      event.preventDefault();
      playPopSound();
      setTimeout(() => { window.location.href = targetUrl; }, 180);
    }

    function toggleFullScreen() {
      playPopSound();
      const fsBtn = document.getElementById('fsBtn');
      const fsIcon = document.getElementById('fsIcon');
      
      const enterPath = 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
      const exitPath = 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';

      if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        fsIcon.querySelector('path').setAttribute('d', exitPath);
        fsBtn.title = "Keluar Layar Penuh";
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        fsIcon.querySelector('path').setAttribute('d', enterPath);
        fsBtn.title = "Layar Penuh";
      }
    }

    /* DATABASE SOAL INTERAKTIF FULLSCREEN */
    const quizDatabase = [
      {
        type: 'sequence',
        title: 'Mengurutkan Daur Hidup Kupu-kupu 🦋',
        subtitle: 'Klik/Pilih urutan yang tepat dari tahap awal hingga akhir!',
        correctOrder: ['egg', 'caterpillar', 'pupa', 'butterfly'],
        items: [
          { id: 'egg', name: '1. Telur', icon: '🥚' },
          { id: 'caterpillar', name: '2. Ulat', icon: '🐛' },
          { id: 'pupa', name: '3. Kepompong', icon: '🟤' },
          { id: 'butterfly', name: '4. Kupu-kupu', icon: '🦋' }
        ]
      },
      {
        type: 'sequence',
        title: 'Mengurutkan Daur Hidup Katak 🐸',
        subtitle: 'Urutkan metamorfosis katak dengan tepat!',
        correctOrder: ['frog_egg', 'tadpole', 'froglet', 'adult_frog'],
        items: [
          { id: 'frog_egg', name: '1. Telur', icon: '⚪' },
          { id: 'tadpole', name: '2. Berudu', icon: '🐟' },
          { id: 'froglet', name: '3. Katak Muda', icon: '🐸' },
          { id: 'adult_frog', name: '4. Katak Dewasa', icon: '🐸' }
        ]
      },
      {
        type: 'match',
        title: 'Menjodohkan Hewan & Hasil Metamorfosis 🔗',
        subtitle: 'Klik satu item di kiri, lalu klik pasangannya yang sesuai di kanan!',
        leftItems: [
          { id: 'm1', name: 'Kupu-kupu', icon: '🦋', pair: 'p1' },
          { id: 'm2', name: 'Katak', icon: '🐸', pair: 'p2' },
          { id: 'm3', name: 'Ayam', icon: '🐔', pair: 'p3' }
        ],
        rightItems: [
          { id: 'p3', name: 'Bertelur di Darat', icon: '🥚', pair: 'm3' },
          { id: 'p1', name: 'Ulat & Kepompong', icon: '🐛', pair: 'm1' },
          { id: 'p2', name: 'Berudu di Air', icon: '🐟', pair: 'm2' }
        ]
      }
    ];

    let currentQuizIndex = 0;
    let sequenceAnswers = [];
    let selectedLeftMatch = null;
    let userMatches = [];

    function openFullscreenQuiz() {
      playPopSound();
      currentQuizIndex = 0;
      loadQuiz(currentQuizIndex);
      document.getElementById('fullscreenQuizApp').classList.add('active');
    }

    function closeFullscreenQuiz() {
      playPopSound();
      document.getElementById('fullscreenQuizApp').classList.remove('active');
      document.getElementById('celebrationOverlay').classList.add('hidden');
    }

    function loadQuiz(index) {
      const qData = quizDatabase[index];
      document.getElementById('appQuizTitle').innerText = qData.title;
      document.getElementById('appQuizSubtitle').innerText = `Soal ${index + 1} Dari ${quizDatabase.length} • ${qData.subtitle}`;
      document.getElementById('appFeedback').innerText = 'Pilih dan selesaikan tantangan!';
      document.getElementById('appFeedback').className = 'text-sm font-black text-amber-400';

      const container = document.getElementById('quizStageContainer');
      container.innerHTML = '';
      clearCanvas();

      if (qData.type === 'sequence') {
        sequenceAnswers = new Array(qData.items.length).fill(null);
        renderSequenceUI();
      } else if (qData.type === 'match') {
        selectedLeftMatch = null;
        userMatches = [];
        renderMatchUI();
      }
    }

    /* LOGIKA MENGURUTKAN (SEQUENCE) */
    function renderSequenceUI() {
      const qData = quizDatabase[currentQuizIndex];
      const container = document.getElementById('quizStageContainer');

      let slotsHTML = '<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">';
      for(let i=0; i<qData.items.length; i++) {
        const filledId = sequenceAnswers[i];
        if (filledId) {
          const item = qData.items.find(x => x.id === filledId);
          slotsHTML += `
            <div onclick="removeSequenceAnswer(${i})" class="bg-emerald-500/20 border-2 border-emerald-400 rounded-2xl p-4 flex flex-col items-center justify-center cursor-pointer hover:bg-emerald-500/30 transition-all">
              <span class="text-4xl mb-1">${item.icon}</span>
              <span class="text-xs font-black text-emerald-300">${item.name}</span>
            </div>
          `;
        } else {
          slotsHTML += `
            <div class="border-2 border-dashed border-slate-600 rounded-2xl p-4 flex flex-col items-center justify-center text-slate-500 font-black text-xs min-h-[100px]">
              Tahap ${i+1}
            </div>
          `;
        }
      }
      slotsHTML += '</div>';

      let optionsHTML = '<div class="flex flex-wrap gap-3 justify-center bg-slate-900/80 p-4 rounded-3xl border border-slate-700">';
      const shuffled = [...qData.items].sort((a,b) => a.id.localeCompare(b.id));
      shuffled.forEach(item => {
        const isSelected = sequenceAnswers.includes(item.id);
        optionsHTML += `
          <button onclick="selectSequenceOption('${item.id}')" ${isSelected ? 'disabled' : ''} class="px-4 py-3 rounded-xl border ${isSelected ? 'opacity-30 border-slate-700 bg-slate-800' : 'bg-slate-800 hover:bg-slate-700 border-slate-600 text-white'} font-black text-xs sm:text-sm flex items-center gap-2 transition-all">
            <span class="text-2xl">${item.icon}</span>
            <span>${item.name}</span>
          </button>
        `;
      });
      optionsHTML += '</div>';

      container.innerHTML = slotsHTML + optionsHTML;
    }

    function selectSequenceOption(id) {
      playPopSound();
      const emptyIdx = sequenceAnswers.indexOf(null);
      if (emptyIdx !== -1) {
        sequenceAnswers[emptyIdx] = id;
        renderSequenceUI();
      }
    }

    function removeSequenceAnswer(idx) {
      playPopSound();
      sequenceAnswers[idx] = null;
      renderSequenceUI();
    }

    /* LOGIKA MENJODOHKAN (MATCHING) */
    function renderMatchUI() {
      const qData = quizDatabase[currentQuizIndex];
      const container = document.getElementById('quizStageContainer');

      let html = '<div class="grid grid-cols-2 gap-12 sm:gap-24 w-full max-w-2xl mx-auto my-4">';
      
      // Kolom Kiri
      html += '<div class="flex flex-col gap-4">';
      qData.leftItems.forEach(item => {
        const isMatched = userMatches.some(m => m.left === item.id);
        const isSelected = selectedLeftMatch === item.id;
        html += `
          <button id="node-left-${item.id}" onclick="clickLeftMatch('${item.id}')" ${isMatched ? 'disabled' : ''} class="match-node ${isSelected ? 'selected' : ''} ${isMatched ? 'matched' : ''} bg-slate-800 border-2 ${isSelected ? 'border-amber-400' : 'border-slate-600'} text-white p-3 sm:p-4 rounded-2xl flex items-center gap-3 font-black text-xs sm:text-sm">
            <span class="text-3xl">${item.icon}</span>
            <span>${item.name}</span>
          </button>
        `;
      });
      html += '</div>';

      // Kolom Kanan
      html += '<div class="flex flex-col gap-4">';
      qData.rightItems.forEach(item => {
        const isMatched = userMatches.some(m => m.right === item.id);
        html += `
          <button id="node-right-${item.id}" onclick="clickRightMatch('${item.id}')" ${isMatched ? 'disabled' : ''} class="match-node ${isMatched ? 'matched' : ''} bg-slate-800 border-2 border-slate-600 text-white p-3 sm:p-4 rounded-2xl flex items-center gap-3 font-black text-xs sm:text-sm">
            <span class="text-3xl">${item.icon}</span>
            <span>${item.name}</span>
          </button>
        `;
      });
      html += '</div></div>';

      container.innerHTML = html;
      setTimeout(drawMatchLines, 50);
    }

    function clickLeftMatch(id) {
      playPopSound();
      selectedLeftMatch = id;
      renderMatchUI();
    }

    function clickRightMatch(rightId) {
      if (!selectedLeftMatch) {
        document.getElementById('appFeedback').innerText = 'Pilih item sebelah kiri terlebih dahulu!';
        return;
      }
      playPopSound();
      userMatches.push({ left: selectedLeftMatch, right: rightId });
      selectedLeftMatch = null;
      renderMatchUI();
    }

    function clearCanvas() {
      const canvas = document.getElementById('matchCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawMatchLines() {
      const canvas = document.getElementById('matchCanvas');
      const app = document.getElementById('fullscreenQuizApp');
      canvas.width = app.clientWidth;
      canvas.height = app.clientHeight;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      userMatches.forEach(m => {
        const leftEl = document.getElementById(`node-left-${m.left}`);
        const rightEl = document.getElementById(`node-right-${m.right}`);
        if (leftEl && rightEl) {
          const rLeft = leftEl.getBoundingClientRect();
          const rRight = rightEl.getBoundingClientRect();
          const rApp = app.getBoundingClientRect();

          const x1 = rLeft.right - rApp.left;
          const y1 = rLeft.top + rLeft.height / 2 - rApp.top;
          const x2 = rRight.left - rApp.left;
          const y2 = rRight.top + rRight.height / 2 - rApp.top;

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      });
    }

    /* PERIKSA JAWABAN & PERAYAAN MERIAH 1 LAYAR */
    function checkAnswer() {
      const qData = quizDatabase[currentQuizIndex];
      let isCorrect = false;

      if (qData.type === 'sequence') {
        if (sequenceAnswers.includes(null)) {
          document.getElementById('appFeedback').innerText = 'Lengkapi semua urutan terlebih dahulu!';
          document.getElementById('appFeedback').className = 'text-sm font-black text-rose-400';
          playSound('wrong');
          return;
        }
        isCorrect = sequenceAnswers.every((ans, idx) => ans === qData.correctOrder[idx]);
      } else if (qData.type === 'match') {
        if (userMatches.length < qData.leftItems.length) {
          document.getElementById('appFeedback').innerText = 'Jodohkan semua pasangan terlebih dahulu!';
          document.getElementById('appFeedback').className = 'text-sm font-black text-rose-400';
          playSound('wrong');
          return;
        }
        isCorrect = userMatches.every(m => {
          const itemLeft = qData.leftItems.find(x => x.id === m.left);
          return itemLeft && itemLeft.pair === m.right;
        });
      }

      if (isCorrect) {
        playSound('correct');
        triggerFullCelebration();
      } else {
        playSound('wrong');
        document.getElementById('appFeedback').innerText = '❌ Jawaban belum tepat! Mari coba lagi.';
        document.getElementById('appFeedback').className = 'text-sm font-black text-rose-400';
      }
    }

    function triggerFullCelebration() {
      // Efek Confetti Kembang Api Meriah
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      setTimeout(() => confetti({ particleCount: 150, angle: 60, spread: 100, origin: { x: 0 } }), 200);
      setTimeout(() => confetti({ particleCount: 150, angle: 120, spread: 100, origin: { x: 1 } }), 400);

      const overlay = document.getElementById('celebrationOverlay');
      const btnNext = document.getElementById('btnNextQuiz');

      if (currentQuizIndex < quizDatabase.length - 1) {
        btnNext.innerText = 'Lanjut Soal Berikutnya 🚀';
      } else {
        btnNext.innerText = 'Selesai & Tutup 🏆';
      }

      overlay.classList.remove('hidden');
    }

    function nextQuizOrClose() {
      playPopSound();
      document.getElementById('celebrationOverlay').classList.add('hidden');
      if (currentQuizIndex < quizDatabase.length - 1) {
        currentQuizIndex++;
        loadQuiz(currentQuizIndex);
      } else {
        closeFullscreenQuiz();
      }
    }

    function resetCurrentQuiz() {
      playPopSound();
      loadQuiz(currentQuizIndex);
    }

    window.addEventListener('resize', () => {
      if (document.getElementById('fullscreenQuizApp').classList.contains('active')) {
        drawMatchLines();
      }
    });
  </script>
</body>
</html>
