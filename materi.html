<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Materi - Siklus Hidup yang Menakjubkan</title>
  
  <!-- Favicon Logo UNEJ -->
  <link rel="icon" type="image/png" href="aset/logo/unej.png" />
  
  <!-- Google Fonts: Plus Jakarta Sans & Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti Library untuk Perayaan Meriah -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: 'Fredoka', 'Nunito', sans-serif;
    }

    /* Container Canva Embed Screen-Fit */
    .canva-embed-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      border: none;
    }

    .canva-embed-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Styling Tombol Aksi Floating Glassmorphism Ceria */
    .nav-btn {
      position: absolute;
      top: 24px;
      z-index: 20;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #059669;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .nav-btn:hover {
      transform: scale(1.15) rotate(8deg);
      background: #fef08a;
      color: #0284c7;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    .home-btn { left: 24px; color: #059669; }
    .fullscreen-btn { right: 24px; color: #7c3aed; }
    .quiz-btn { right: 88px; color: #ea580c; }

    /* FULLSCREEN GAME SCREEN CERIA */
    #fullscreenQuizApp {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 40%, #a7f3d0 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: scale(0.92);
    }

    #fullscreenQuizApp.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Canvas Garis Menjodohkan */
    #matchCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .match-node {
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .match-node:hover {
      transform: scale(1.08) translateY(-3px);
    }

    .match-node.selected {
      box-shadow: 0 0 0 6px #facc15, 0 14px 28px rgba(0,0,0,0.3);
      transform: scale(1.1);
    }

    .match-node.matched {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(50%);
    }

    /* Animasi Gelembung Ceria */
    @keyframes floatBubble {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }
    .float-anim { animation: floatBubble 3s infinite ease-in-out; }

    @keyframes partyPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.15) rotate(8deg); }
    }
    .party-anim { animation: partyPulse 1.2s infinite ease-in-out; }

    /* Tombol Clean Seamless (Tanpa Border) */
    .btn-child-clean {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-child-clean:hover {
      transform: translateY(-3px) scale(1.03);
    }
    .btn-child-clean:active {
      transform: translateY(1px) scale(0.97);
    }

    /* Ukuran Gambar SVG Super Besar */
    .quiz-svg-icon {
      width: 95px;
      height: 95px;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.2));
    }

    .quiz-svg-option {
      width: 75px;
      height: 75px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
    }

    @media (min-width: 640px) {
      .quiz-svg-icon {
        width: 125px;
        height: 125px;
      }
      .quiz-svg-option {
        width: 95px;
        height: 95px;
      }
    }

    @media (max-height: 700px), (max-width: 480px) {
      .nav-btn { top: 16px; width: 44px; height: 44px; }
      .nav-btn svg { width: 22px; height: 22px; }
      .home-btn { left: 16px; }
      .fullscreen-btn { right: 16px; }
      .quiz-btn { right: 70px; }
      .quiz-svg-icon { width: 75px; height: 75px; }
      .quiz-svg-option { width: 60px; height: 60px; }
    }
  </style>
</head>
<body class="antialiased select-none">

  <!-- Tombol Home -->
  <a href="https://izzulfahmy.github.io/Ular-Tangga-Matematika/" class="nav-btn home-btn" title="Kembali ke Beranda" onclick="playClickSound(event, this.href)">
    <svg viewBox="0 0 24 24">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </a>

  <!-- Tombol Gamepad / Latihan Soal Interaktif -->
  <button class="nav-btn quiz-btn" id="quizBtn" title="Latihan Soal Interaktif Fullscreen" onclick="openFullscreenQuiz()">
    <svg viewBox="0 0 24 24">
      <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H9v2H7v-2H5v-2h2V9h2v2h2v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
    </svg>
  </button>

  <!-- Tombol Fullscreen Icon SVG -->
  <button class="nav-btn fullscreen-btn" id="fsBtn" title="Layar Penuh" onclick="toggleFullScreen()">
    <svg id="fsIcon" viewBox="0 0 24 24">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
  </button>

  <!-- Container Embed Canva PPT Full Screen -->
  <div class="canva-embed-container">
    <iframe loading="lazy" src="https://www.canva.com/design/DAHVDRpj6kI/8GbnjjdWzKv45lK9ZJYu9Q/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
  </div>

  <!-- MODAL FULLSCREEN LATIHAN SOAL INTERAKTIF CERIA -->
  <div id="fullscreenQuizApp">
    
    <!-- Top Bar Navigation Clean -->
    <div class="flex items-center justify-between bg-white/90 backdrop-blur-md p-3 sm:p-4 rounded-3xl shadow-xl">
      <div class="flex items-center gap-3">
        <div class="text-3xl sm:text-4xl bg-yellow-300 p-2 rounded-2xl float-anim shadow-sm">🎈</div>
        <div>
          <h2 id="appQuizTitle" class="text-lg sm:text-2xl font-black text-slate-800 tracking-wide">Latihan Interaktif Daur Hidup</h2>
          <p id="appQuizSubtitle" class="text-xs sm:text-sm font-bold text-sky-600 uppercase tracking-wider">Soal 1 Dari 4</p>
        </div>
      </div>
      <button onclick="closeFullscreenQuiz()" class="btn-child-clean px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-2xl text-xs sm:text-sm font-black transition-all shadow-md flex items-center gap-1.5">
        <span>Tutup</span>
        <span class="text-base">✖</span>
      </button>
    </div>

    <!-- Main Dynamic Content Area -->
    <div class="my-auto w-full max-w-5xl mx-auto relative flex flex-col items-center justify-center p-2">
      <canvas id="matchCanvas"></canvas>
      <div id="quizStageContainer" class="w-full"></div>
    </div>

    <!-- Bottom Actions Bar Clean -->
    <div class="bg-white/90 backdrop-blur-md p-3 sm:p-4 rounded-3xl shadow-xl flex flex-col sm:flex-row items-center justify-between gap-3">
      <div id="appFeedback" class="text-sm sm:text-base font-black text-amber-600 text-center sm:text-left">
        Pilih dan pasangkan gambar dengan benar ya! 🌟
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button onclick="resetCurrentQuiz()" class="btn-child-clean flex-1 sm:flex-none px-5 py-2.5 bg-amber-400 hover:bg-amber-500 text-slate-900 font-black rounded-2xl text-xs sm:text-sm transition-all shadow-md">Ulangi 🔄</button>
        <button onclick="checkAnswer()" id="btnCheckAnswer" class="btn-child-clean flex-1 sm:flex-none px-8 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-2xl text-xs sm:text-sm transition-all shadow-lg uppercase tracking-wider">Periksa Jawaban 🚀</button>
      </div>
    </div>

    <!-- PERAYAAN KEMBANG API & CONFETTI CERIA 1 LAYAR FIT -->
    <div id="celebrationOverlay" class="fixed inset-0 z-[1000] bg-slate-900/85 backdrop-blur-md hidden flex flex-col justify-center items-center p-4 text-center">
      <div class="max-w-md w-full flex flex-col items-center bg-gradient-to-b from-yellow-300 via-amber-400 to-orange-500 p-8 rounded-[3rem] shadow-2xl relative">
        <div class="text-7xl party-anim mb-3 drop-shadow-md">🏆</div>
        <h2 class="text-3xl sm:text-4xl font-black text-slate-900 mb-2 uppercase tracking-wide">HEBAT BANGET!</h2>
        <p id="celebrationMsg" class="text-base sm:text-lg font-black text-slate-800 mb-6 leading-relaxed">Kamu berhasil menyelesaikan latihan dengan sempurna! 🎉</p>
        <button onclick="nextQuizOrClose()" id="btnNextQuiz" class="btn-child-clean w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-2xl shadow-xl transition-all text-base uppercase tracking-wider">Lanjut Soal Berikutnya 🚀</button>
      </div>
    </div>

  </div>

  <!-- Audio Synthesizer & Dynamic Logic Script -->
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPopSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playSound(type) {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        if (type === 'correct') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.2, now + i * 0.08); gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.2);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now); osc.frequency.linearRampToValueAtTime(110, now + 0.3);
          gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
        }
      } catch (e) {}
    }

    function playClickSound(event, targetUrl) {
      event.preventDefault();
      playPopSound();
      setTimeout(() => { window.location.href = targetUrl; }, 180);
    }

    function toggleFullScreen() {
      playPopSound();
      const fsBtn = document.getElementById('fsBtn');
      const fsIcon = document.getElementById('fsIcon');
      
      const enterPath = 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
      const exitPath = 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';

      if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        fsIcon.querySelector('path').setAttribute('d', exitPath);
        fsBtn.title = "Keluar Layar Penuh";
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        fsIcon.querySelector('path').setAttribute('d', enterPath);
        fsBtn.title = "Layar Penuh";
      }
    }

    /* DATABASE SOAL INTERAKTIF */
    const quizDatabase = [
      {
        type: 'sequence',
        title: 'Urutan Daur Hidup Kupu-kupu 🦋',
        subtitle: 'Urutkan gambar pertumbuhan kupu-kupu dari awal sampai akhir!',
        correctOrder: ['egg', 'caterpillar', 'pupa', 'butterfly'],
        items: [
          { id: 'egg', svg: 'aset/latihansoal/telurkupu.svg', color: 'bg-amber-100/90 shadow-lg' },
          { id: 'caterpillar', svg: 'aset/latihansoal/ulatkupu.svg', color: 'bg-emerald-100/90 shadow-lg' },
          { id: 'pupa', svg: 'aset/latihansoal/kepompong.svg', color: 'bg-orange-100/90 shadow-lg' },
          { id: 'butterfly', svg: 'aset/latihansoal/kupukupu.svg', color: 'bg-pink-100/90 shadow-lg' }
        ]
      },
      {
        type: 'sequence',
        title: 'Urutan Daur Hidup Katak 🐸',
        subtitle: 'Urutkan gambar metamorfosis katak dari awal sampai akhir!',
        correctOrder: ['frog_egg', 'tadpole', 'froglet', 'adult_frog'],
        items: [
          { id: 'frog_egg', svg: 'aset/latihansoal/telurkatak.svg', color: 'bg-slate-100/90 shadow-lg' },
          { id: 'tadpole', svg: 'aset/latihansoal/berudu.svg', color: 'bg-sky-100/90 shadow-lg' },
          { id: 'froglet', svg: 'aset/latihansoal/katakmuda.svg', color: 'bg-teal-100/90 shadow-lg' },
          { id: 'adult_frog', svg: 'aset/latihansoal/katak.svg', color: 'bg-green-100/90 shadow-lg' }
        ]
      },
      {
        type: 'match',
        title: 'Jodohkan Pasangan Hewan 🔗',
        subtitle: 'Hubungkan gambar hewan di kiri dengan pasangannya yang sesuai di kanan!',
        leftItems: [
          { id: 'm1', svg: 'aset/latihansoal/kupukupu.svg', pair: 'p1', bg: 'bg-pink-100/90 shadow-lg' },
          { id: 'm2', svg: 'aset/latihansoal/katak.svg', pair: 'p2', bg: 'bg-emerald-100/90 shadow-lg' },
          { id: 'm3', svg: 'aset/latihansoal/ayam.svg', pair: 'p3', bg: 'bg-amber-100/90 shadow-lg' }
        ],
        rightItems: [
          { id: 'p3', svg: 'aset/latihansoal/telur.svg', pair: 'm3', bg: 'bg-yellow-100/90 shadow-lg' },
          { id: 'p1', svg: 'aset/latihansoal/kepompong.svg', pair: 'm1', bg: 'bg-purple-100/90 shadow-lg' },
          { id: 'p2', svg: 'aset/latihansoal/berudu.svg', pair: 'm2', bg: 'bg-cyan-100/90 shadow-lg' }
        ]
      },
      {
        type: 'match',
        title: 'Jodohkan Jenis Metamorfosis 🧬',
        subtitle: 'Hubungkan gambar hewan dengan jenis metamorfosisnya yang tepat!',
        leftItems: [
          { id: 'meta1', svg: 'aset/latihansoal/kupukupu.svg', pair: 'pm1', bg: 'bg-purple-100/90 shadow-lg' },
          { id: 'meta2', svg: 'aset/latihansoal/belalang.svg', pair: 'pm2', bg: 'bg-lime-100/90 shadow-lg' },
          { id: 'meta3', svg: 'aset/latihansoal/nyamuk.svg', pair: 'pm1', pairAlt: 'pm1', bg: 'bg-rose-100/90 shadow-lg' }
        ],
        rightItems: [
          { id: 'pm2', name: 'Metamorfosis Tidak Sempurna 🌱', pair: 'meta2', bg: 'bg-emerald-500 text-white shadow-lg' },
          { id: 'pm1', name: 'Metamorfosis Sempurna ✨', pair: 'meta1', bg: 'bg-indigo-500 text-white shadow-lg' }
        ]
      }
    ];

    let currentQuizIndex = 0;
    let sequenceAnswers = [];
    let selectedLeftMatch = null;
    let userMatches = [];

    function openFullscreenQuiz() {
      playPopSound();
      currentQuizIndex = 0;
      loadQuiz(currentQuizIndex);
      document.getElementById('fullscreenQuizApp').classList.add('active');
    }

    function closeFullscreenQuiz() {
      playPopSound();
      document.getElementById('fullscreenQuizApp').classList.remove('active');
      document.getElementById('celebrationOverlay').classList.add('hidden');
    }

    function loadQuiz(index) {
      const qData = quizDatabase[index];
      document.getElementById('appQuizTitle').innerText = qData.title;
      document.getElementById('appQuizSubtitle').innerText = `Soal ${index + 1} Dari ${quizDatabase.length} • ${qData.subtitle}`;
      document.getElementById('appFeedback').innerText = 'Pilih dan selesaikan tantangan! 🌟';
      document.getElementById('appFeedback').className = 'text-sm sm:text-base font-black text-amber-600 text-center sm:text-left';

      const container = document.getElementById('quizStageContainer');
      container.innerHTML = '';
      clearCanvas();

      if (qData.type === 'sequence') {
        sequenceAnswers = new Array(qData.items.length).fill(null);
        renderSequenceUI();
      } else if (qData.type === 'match') {
        selectedLeftMatch = null;
        userMatches = [];
        renderMatchUI();
      }
    }

    /* LOGIKA MENGURUTKAN GAMBAR BESAR */
    function renderSequenceUI() {
      const qData = quizDatabase[currentQuizIndex];
      const container = document.getElementById('quizStageContainer');

      let slotsHTML = '<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6 mb-8">';
      for(let i=0; i<qData.items.length; i++) {
        const filledId = sequenceAnswers[i];
        if (filledId) {
          const item = qData.items.find(x => x.id === filledId);
          slotsHTML += `
            <div onclick="removeSequenceAnswer(${i})" class="btn-child-clean ${item.color} rounded-3xl p-4 sm:p-6 flex flex-col items-center justify-center cursor-pointer min-h-[140px] sm:min-h-[180px]">
              <img src="${item.svg}" class="quiz-svg-icon float-anim" />
            </div>
          `;
        } else {
          slotsHTML += `
            <div class="bg-white/30 backdrop-blur-md rounded-3xl p-4 flex flex-col items-center justify-center text-white font-black text-lg min-h-[140px] sm:min-h-[180px] shadow-inner">
              Tahap ${i+1}
            </div>
          `;
        }
      }
      slotsHTML += '</div>';

      let optionsHTML = '<div class="flex flex-wrap gap-5 justify-center bg-white/90 backdrop-blur-md p-5 sm:p-6 rounded-3xl shadow-xl">';
      const shuffled = [...qData.items].sort((a,b) => a.id.localeCompare(b.id));
      shuffled.forEach(item => {
        const isSelected = sequenceAnswers.includes(item.id);

        optionsHTML += `
          <button onclick="selectSequenceOption('${item.id}')" ${isSelected ? 'disabled' : ''} class="btn-child-clean ${isSelected ? 'opacity-30 bg-slate-200 shadow-none' : `${item.color} hover:scale-105`} rounded-2xl p-4 flex items-center justify-center">
            <img src="${item.svg}" class="quiz-svg-option" />
          </button>
        `;
      });
      optionsHTML += '</div>';

      container.innerHTML = slotsHTML + optionsHTML;
    }

    function selectSequenceOption(id) {
      playPopSound();
      const emptyIdx = sequenceAnswers.indexOf(null);
      if (emptyIdx !== -1) {
        sequenceAnswers[emptyIdx] = id;
        renderSequenceUI();
      }
    }

    function removeSequenceAnswer(idx) {
      playPopSound();
      sequenceAnswers[idx] = null;
      renderSequenceUI();
    }

    /* LOGIKA MENJODOHKAN */
    function renderMatchUI() {
      const qData = quizDatabase[currentQuizIndex];
      const container = document.getElementById('quizStageContainer');

      let html = '<div class="grid grid-cols-2 gap-8 sm:gap-24 w-full max-w-3xl mx-auto my-4">';
      
      // Kolom Kiri
      html += '<div class="flex flex-col gap-4 sm:gap-5 justify-center">';
      qData.leftItems.forEach(item => {
        const isMatched = userMatches.some(m => m.left === item.id);
        const isSelected = selectedLeftMatch === item.id;
        html += `
          <button id="node-left-${item.id}" onclick="clickLeftMatch('${item.id}')" ${isMatched ? 'disabled' : ''} class="match-node btn-child-clean ${isSelected ? 'selected' : ''} ${isMatched ? 'matched' : ''} ${item.bg} p-4 sm:p-5 rounded-3xl flex items-center justify-center shadow-xl">
            <img src="${item.svg}" class="quiz-svg-option" />
          </button>
        `;
      });
      html += '</div>';

      // Kolom Kanan (Gambar atau Teks)
      html += '<div class="flex flex-col gap-4 sm:gap-5 justify-center">';
      qData.rightItems.forEach(item => {
        const isMatched = userMatches.some(m => m.right === item.id && (currentQuizIndex !== 3 || userMatches.filter(x => x.right === item.id).length >= (item.id === 'pm1' ? 2 : 1)));
        
        const content = item.svg 
          ? `<img src="${item.svg}" class="quiz-svg-option" />`
          : `<span class="font-black text-sm sm:text-lg text-center leading-tight px-2">${item.name}</span>`;

        html += `
          <button id="node-right-${item.id}" onclick="clickRightMatch('${item.id}')" ${isMatched ? 'disabled' : ''} class="match-node btn-child-clean ${isMatched ? 'matched' : ''} ${item.bg} p-4 sm:p-6 rounded-3xl flex items-center justify-center shadow-xl min-h-[80px]">
            ${content}
          </button>
        `;
      });
      html += '</div></div>';

      container.innerHTML = html;
      setTimeout(drawMatchLines, 50);
    }

    function clickLeftMatch(id) {
      playPopSound();
      selectedLeftMatch = id;
      renderMatchUI();
    }

    function clickRightMatch(rightId) {
      if (!selectedLeftMatch) {
        document.getElementById('appFeedback').innerText = 'Pilih gambar sebelah kiri dulu ya!';
        return;
      }
      playPopSound();
      userMatches.push({ left: selectedLeftMatch, right: rightId });
      selectedLeftMatch = null;
      renderMatchUI();
    }

    function clearCanvas() {
      const canvas = document.getElementById('matchCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawMatchLines() {
      const canvas = document.getElementById('matchCanvas');
      const app = document.getElementById('fullscreenQuizApp');
      canvas.width = app.clientWidth;
      canvas.height = app.clientHeight;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      userMatches.forEach(m => {
        const leftEl = document.getElementById(`node-left-${m.left}`);
        const rightEl = document.getElementById(`node-right-${m.right}`);
        if (leftEl && rightEl) {
          const rLeft = leftEl.getBoundingClientRect();
          const rRight = rightEl.getBoundingClientRect();
          const rApp = app.getBoundingClientRect();

          const x1 = rLeft.right - rApp.left;
          const y1 = rLeft.top + rLeft.height / 2 - rApp.top;
          const x2 = rRight.left - rApp.left;
          const y2 = rRight.top + rRight.height / 2 - rApp.top;

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 7;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
      });
    }

    /* PERIKSA JAWABAN & PERAYAAN MERIAH CERIA */
    function checkAnswer() {
      const qData = quizDatabase[currentQuizIndex];
      let isCorrect = false;

      if (qData.type === 'sequence') {
        if (sequenceAnswers.includes(null)) {
          document.getElementById('appFeedback').innerText = 'Lengkapi semua urutannya terlebih dahulu ya! 😊';
          document.getElementById('appFeedback').className = 'text-sm sm:text-base font-black text-rose-600 text-center sm:text-left';
          playSound('wrong');
          return;
        }
        isCorrect = sequenceAnswers.every((ans, idx) => ans === qData.correctOrder[idx]);
      } else if (qData.type === 'match') {
        if (userMatches.length < qData.leftItems.length) {
          document.getElementById('appFeedback').innerText = 'Jodohkan semua pasangannya terlebih dahulu! 😊';
          document.getElementById('appFeedback').className = 'text-sm sm:text-base font-black text-rose-600 text-center sm:text-left';
          playSound('wrong');
          return;
        }
        isCorrect = userMatches.every(m => {
          const itemLeft = qData.leftItems.find(x => x.id === m.left);
          return itemLeft && (itemLeft.pair === m.right || itemLeft.pairAlt === m.right);
        });
      }

      if (isCorrect) {
        playSound('correct');
        triggerFullCelebration();
      } else {
        playSound('wrong');
        document.getElementById('appFeedback').innerText = '❌ Jawaban belum tepat! Yuk coba periksa lagi!';
        document.getElementById('appFeedback').className = 'text-sm sm:text-base font-black text-rose-600 text-center sm:text-left';
      }
    }

    function triggerFullCelebration() {
      confetti({ particleCount: 140, spread: 90, origin: { y: 0.6 } });
      setTimeout(() => confetti({ particleCount: 160, angle: 60, spread: 100, origin: { x: 0 } }), 200);
      setTimeout(() => confetti({ particleCount: 160, angle: 120, spread: 100, origin: { x: 1 } }), 400);

      const overlay = document.getElementById('celebrationOverlay');
      const btnNext = document.getElementById('btnNextQuiz');

      if (currentQuizIndex < quizDatabase.length - 1) {
        btnNext.innerText = 'Lanjut Soal Berikutnya 🚀';
      } else {
        btnNext.innerText = 'Selesai & Tutup 🏆';
      }

      overlay.classList.remove('hidden');
    }

    function nextQuizOrClose() {
      playPopSound();
      document.getElementById('celebrationOverlay').classList.add('hidden');
      if (currentQuizIndex < quizDatabase.length - 1) {
        currentQuizIndex++;
        loadQuiz(currentQuizIndex);
      } else {
        closeFullscreenQuiz();
      }
    }

    function resetCurrentQuiz() {
      playPopSound();
      loadQuiz(currentQuizIndex);
    }

    window.addEventListener('resize', () => {
      if (document.getElementById('fullscreenQuizApp').classList.contains('active')) {
        drawMatchLines();
      }
    });
  </script>
</body>
</html>
