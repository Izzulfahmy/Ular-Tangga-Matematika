<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Control - Ular Tangga</title>
    
    <!-- Favicon UNEJ -->
    <link rel="icon" href="aset/logo/unej.png" type="image/png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Nunito', 'sans-serif'],
                        jakarta: ['Plus Jakarta Sans', 'sans-serif'] 
                    },
                    colors: {
                        brand: { 50: '#ecfdf5', 500: '#10b981', 600: '#059669', 900: '#064e3b' }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-pattern {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .toy-btn { transition: transform 0.1s; }
        .toy-btn:active { transform: translateY(3px); }
        .toy-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
    </style>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3hRtUyDs8_zTLT-977eYtgcf74yvVu9w",
            authDomain: "rahasia-kehidupan-hewan.firebaseapp.com",
            projectId: "rahasia-kehidupan-hewan",
            storageBucket: "rahasia-kehidupan-hewan.firebasestorage.app",
            messagingSenderId: "903453505974",
            appId: "1:903453505974:web:9255b8349ff0a8a51fe917",
            measurementId: "G-9Q1P63ZFYF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.dbFirestore = db;
        window.fsDoc = doc;
        window.fsSetDoc = setDoc;
        window.fsOnSnapshot = onSnapshot;
    </script>
</head>
<body class="bg-pattern min-h-screen text-slate-100 flex flex-col justify-between p-4 antialiased font-sans">

    <!-- HEADER STATUS PEMAIN -->
    <div class="bg-slate-800/80 backdrop-blur-md p-4 rounded-3xl border border-slate-700/60 shadow-lg text-center">
        <div id="player-badge" class="inline-block px-3 py-1 bg-emerald-500/20 text-emerald-400 font-extrabold text-xs rounded-full border border-emerald-500/30 uppercase tracking-wider mb-2">
            Remote Pemain
        </div>
        <h1 id="player-title" class="text-2xl font-black font-jakarta text-white tracking-tight">Pemain --</h1>
        <p id="game-id-tag" class="text-[10px] text-slate-400 font-bold tracking-widest uppercase mt-0.5">ROOM: -</p>
    </div>

    <!-- AREA UTAMA INTERAKSI / CONTROL -->
    <div class="my-auto py-6 flex flex-col items-center gap-6">

        <!-- STATUS GILIRAN BANNER -->
        <div id="turn-banner" class="w-full bg-amber-500/10 border-2 border-amber-500/30 p-4 rounded-3xl text-center transition-all">
            <span class="text-3xl block mb-1" id="turn-icon">⏳</span>
            <h2 class="text-lg font-black text-amber-400" id="turn-text">Menunggu Giliran...</h2>
            <p class="text-xs text-slate-400 font-bold mt-1" id="turn-subtext">Tunggu sampai giliranmu tiba untuk melempar dadu.</p>
        </div>

        <!-- TOMBOL LEMPAR DADU HP -->
        <button id="btn-remote-roll" onclick="sendRollDice()" disabled class="toy-btn w-full py-6 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-3xl text-xl shadow-xl border-b-4 border-emerald-800 flex flex-col items-center justify-center gap-1 uppercase tracking-wider transition-all">
            <span class="text-3xl">🎲</span>
            <span>LEMPAR DADU</span>
        </button>

        <!-- PANEL REMOTE JAWABAN KUIS -->
        <div class="w-full bg-slate-800/60 p-4 rounded-3xl border border-slate-700/50 space-y-2">
            <p class="text-xs font-black text-slate-400 uppercase tracking-wider text-center mb-2">Pilih Jawaban Kuis</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="sendAnswer('A')" id="btn-ans-a" disabled class="toy-btn py-3.5 bg-slate-700 hover:bg-blue-600 font-black rounded-2xl text-lg text-white border-b-2 border-slate-900 transition-all">A</button>
                <button onclick="sendAnswer('B')" id="btn-ans-b" disabled class="toy-btn py-3.5 bg-slate-700 hover:bg-blue-600 font-black rounded-2xl text-lg text-white border-b-2 border-slate-900 transition-all">B</button>
                <button onclick="sendAnswer('C')" id="btn-ans-c" disabled class="toy-btn py-3.5 bg-slate-700 hover:bg-blue-600 font-black rounded-2xl text-lg text-white border-b-2 border-slate-900 transition-all">C</button>
                <button onclick="sendAnswer('D')" id="btn-ans-d" disabled class="toy-btn py-3.5 bg-slate-700 hover:bg-blue-600 font-black rounded-2xl text-lg text-white border-b-2 border-slate-900 transition-all">D</button>
            </div>
        </div>

    </div>

    <!-- FOOTER INFORMASI -->
    <div class="text-center text-[10px] text-slate-500 font-bold tracking-wider uppercase">
        Ular Tangga Edukasi &bull; Universitas Jember
    </div>

    <!-- LOGIKA SCRIPT REMOTE -->
    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playPopSound() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.12);

            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.12);
        }

        // Parse Parameter URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('gameId') || 'UNKNOWN';
        const playerIndex = parseInt(urlParams.get('player') || '0', 10);

        document.getElementById('player-title').innerText = `Pemain ${playerIndex + 1}`;
        document.getElementById('game-id-tag').innerText = `ROOM: ${gameId}`;

        let isMyTurn = false;
        let isRolling = false;

        document.addEventListener('DOMContentLoaded', () => {
            let checkFirebase = setInterval(() => {
                if(window.dbFirestore) {
                    clearInterval(checkFirebase);
                    initRemoteListener();
                }
            }, 100);
        });

        function initRemoteListener() {
            const gameRef = window.fsDoc(window.dbFirestore, "game_sessions", gameId);

            window.fsOnSnapshot(gameRef, (docSnap) => {
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    const activePlayer = data.currentPlayer;

                    if(activePlayer === playerIndex) {
                        setTurnState(true);
                    } else {
                        setTurnState(false);
                    }
                }
            });
        }

        function setTurnState(active) {
            isMyTurn = active;
            if(!active) isRolling = false; // Reset lock saat berpindah giliran

            const btnRoll = document.getElementById('btn-remote-roll');
            const turnBanner = document.getElementById('turn-banner');
            const turnIcon = document.getElementById('turn-icon');
            const turnText = document.getElementById('turn-text');
            const turnSubtext = document.getElementById('turn-subtext');

            const ansBtns = ['a', 'b', 'c', 'd'].map(c => document.getElementById(`btn-ans-${c}`));

            if(active) {
                btnRoll.disabled = isRolling;
                ansBtns.forEach(b => b.disabled = false);

                turnBanner.className = "w-full bg-emerald-500/20 border-2 border-emerald-500/40 p-4 rounded-3xl text-center transition-all animate-pulse";
                turnIcon.innerText = "🎯";
                turnText.innerText = "GILIRANMU!";
                turnText.className = "text-lg font-black text-emerald-400";
                turnSubtext.innerText = "Tekan tombol Lempar Dadu di bawah sekarang!";
            } else {
                btnRoll.disabled = true;
                ansBtns.forEach(b => b.disabled = true);

                turnBanner.className = "w-full bg-slate-800/40 border-2 border-slate-700/40 p-4 rounded-3xl text-center transition-all";
                turnIcon.innerText = "⏳";
                turnText.innerText = "Menunggu Giliran...";
                turnText.className = "text-lg font-black text-slate-400";
                turnSubtext.innerText = "Tunggu hingga giliran pemain lain selesai.";
            }
        }

        function sendRollDice() {
            if(!isMyTurn || isRolling) return;
            isRolling = true;
            playPopSound();
            
            document.getElementById('btn-remote-roll').disabled = true;

            const gameRef = window.fsDoc(window.dbFirestore, "game_sessions", gameId);
            window.fsSetDoc(gameRef, {
                lastAction: {
                    type: "ROLL_DICE",
                    player: playerIndex,
                    timestamp: Date.now()
                }
            }, { merge: true }).then(() => {
                setTimeout(() => { isRolling = false; }, 1500);
            });
        }

        function sendAnswer(ans) {
            if(!isMyTurn) return;
            playPopSound();

            const gameRef = window.fsDoc(window.dbFirestore, "game_sessions", gameId);
            window.fsSetDoc(gameRef, {
                lastAction: {
                    type: "SUBMIT_ANSWER",
                    player: playerIndex,
                    answer: ans,
                    timestamp: Date.now()
                }
            }, { merge: true });
        }
    </script>
</body>
</html>
