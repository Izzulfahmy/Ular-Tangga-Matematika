<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IPAS Kelas 3 - Siklus Hidup yang Menakjubkan</title>
  
  <!-- Favicon Logo UNEJ -->
  <link rel="icon" type="image/png" href="aset/logo/unej.png" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* Reset & Core Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Background Langit Biru Cerah */
    body {
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 60%, #f0f9ff 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Outer Wrapper Latar Belakang Alam */
    .nature-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    /* Bukit Hijau / Bukit Rumput Bawah */
    .land-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 140px;
      background: linear-gradient(180deg, #86efac 0%, #4ade80 40%, #22c55e 100%);
      border-radius: 50% 50% 0 0 / 20px 20px 0 0;
      z-index: 2;
      box-shadow: 0 -4px 20px rgba(34, 197, 94, 0.2);
    }

    /* Keyframe Animasi Floating & Fly */
    @keyframes floatSoft {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    @keyframes flySoft {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(6px); }
      100% { transform: translateY(0px) translateX(0px); }
    }

    /* Positioning Aset Tumbuhan */
    .bg-asset {
      position: absolute;
      object-fit: contain;
      z-index: 2;
    }

    .pohon-kiri { left: -20px; bottom: 40px; width: 180px; }
    .pohon-kanan { right: -20px; bottom: 40px; width: 190px; }

    /* Positioning Aset Hewan */
    .animal {
      position: absolute;
      z-index: 4;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
    }

    /* Hewan Terbang (Udara) */
    .capung { top: 16%; left: 7%; width: 70px; animation: flySoft 4s infinite ease-in-out; }
    .tawon { top: 14%; right: 6%; width: 65px; animation: flySoft 3.5s infinite ease-in-out 0.5s; }
    .burung { top: 7%; right: 22%; width: 80px; animation: flySoft 5s infinite ease-in-out 1s; }

    /* Hewan Darat (Pijak Tanah) */
    .gajah { bottom: 15px; left: 2%; width: 145px; animation: floatSoft 6s infinite ease-in-out; }
    .anjing { bottom: 12px; left: 145px; width: 85px; animation: floatSoft 4.5s infinite ease-in-out 0.2s; }
    .landak { bottom: 10px; left: 235px; width: 55px; }

    .jerapah { bottom: 25px; right: 140px; width: 110px; animation: floatSoft 7s infinite ease-in-out 0.8s; }
    .gorila { bottom: 15px; right: 2%; width: 125px; animation: floatSoft 5.5s infinite ease-in-out 0.3s; }
    .tikus { bottom: 10px; right: 260px; width: 45px; }

    /* Main Dashboard Layout Canvas */
    .dashboard-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      max-width: 1100px;
      padding: 24px 20px 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    /* 1. Header Logo */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 28px;
      border-radius: 60px;
      border: 2px solid #ffffff;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.12);
    }

    .logo-img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    /* 2. Hero Content Area */
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      width: 100%;
    }

    .tag-subtitle {
      display: inline-flex;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: #0284c7;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #38bdf8;
      padding: 6px 20px;
      border-radius: 30px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    .main-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 16px;
      white-space: nowrap;
      width: 100%;
    }

    .main-title span {
      background: linear-gradient(135deg, #ff4757 0%, #ff6b81 40%, #ffa502 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12));
    }

    .badge-ppg {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      color: #b45309;
      border: 2px solid #fcd34d;
      padding: 8px 22px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.18);
    }

    .badge-ppg::before {
      content: "🎓";
    }

    /* 3. Navigation Menu Grid */
    .menu-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 30px;
    }

    .menu-card {
      flex: 1;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12), inset 0 0 0 2px #ffffff;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .menu-card.materi { border-bottom: 5px solid #2563eb; }
    .menu-card.ular-tangga { border-bottom: 5px solid #059669; }

    .icon-wrapper {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.9rem;
    }

    .materi .icon-wrapper { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; }
    .ular-tangga .icon-wrapper { background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: #fff; }

    .card-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }

    .menu-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.16);
    }

    /* Responsive Breakdown */
    @media (max-width: 900px) {
      .landak, .tikus { display: none; }
      .jerapah { right: 100px; }
      .anjing { left: 120px; }
    }

    @media (max-width: 680px) {
      .main-title { white-space: normal; }
      .gajah { width: 100px; }
      .gorila { width: 90px; }
      .jerapah { width: 80px; right: 70px; }
      .anjing { display: none; }
      .pohon-kiri, .pohon-kanan { width: 120px; }
    }
  </style>
</head>
<body>

  <!-- Latar Belakang Alam & Aset SVG -->
  <div class="nature-background">
    <!-- Bukit Rumput Tanah Bawah -->
    <div class="land-bg"></div>

    <!-- Tumbuhan / Pohon -->
    <img src="aset/tumbuhan/pohon.svg" class="bg-asset pohon-kiri" alt="Pohon">
    <img src="aset/tumbuhan/pohon.svg" class="bg-asset pohon-kanan" alt="Pohon">

    <!-- Hewan Terbang -->
    <img src="aset/hewan/capung.svg" class="animal capung" alt="Capung">
    <img src="aset/hewan/tawon.svg" class="animal tawon" alt="Tawon">
    <img src="aset/hewan/burung.svg" class="animal burung" alt="Burung">

    <!-- Hewan Darat Berdiri di Atas Rumput -->
    <img src="aset/hewan/gajah.svg" class="animal gajah" alt="Gajah">
    <img src="aset/hewan/anjing.svg" class="animal anjing" alt="Anjing">
    <img src="aset/hewan/landak.svg" class="animal landak" alt="Landak">
    <img src="aset/hewan/jerapah.svg" class="animal jerapah" alt="Jerapah">
    <img src="aset/hewan/gorila.svg" class="animal gorila" alt="Gorila">
    <img src="aset/hewan/tikus.svg" class="animal tikus" alt="Tikus">
  </div>

  <!-- Dashboard Container Utama -->
  <main class="dashboard-wrapper">
    
    <!-- 1. Top Header Logos -->
    <header class="logo-container">
      <img src="aset/logo/tutwuri.png" alt="Kemendikbud" class="logo-img">
      <img src="aset/logo/unej.png" alt="Universitas Jember" class="logo-img">
      <img src="aset/logo/ppg.png" alt="PPG" class="logo-img">
      <img src="aset/logo/fkip.png" alt="FKIP UNEJ" class="logo-img">
    </header>

    <!-- 2. Hero Title Central -->
    <section class="hero-section">
      <div class="tag-subtitle">Media Pembelajaran IPAS Kelas 3</div>
      <h1 class="main-title">
        <span>Siklus Hidup yang Menakjubkan</span>
      </h1>
      <div class="badge-ppg">
        PPG Calon Guru Gelombang 1 Tahun 2026
      </div>
    </section>

    <!-- 3. Bottom Menu Cards -->
    <nav class="menu-grid">
      <a href="materi/index.html" class="menu-card materi" onclick="playClickSound(event, this.href)">
        <div class="icon-wrapper">📚</div>
        <span class="card-label">Materi</span>
      </a>

      <a href="ulartangga.html" class="menu-card ular-tangga" onclick="playClickSound(event, this.href)">
        <div class="icon-wrapper">🎲</div>
        <span class="card-label">Ular Tangga</span>
      </a>
    </nav>

  </main>

  <!-- Sound Effects Script -->
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playPopSound() {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playClickSound(event, targetUrl) {
      event.preventDefault();
      playPopSound();
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 180);
    }
  </script>
</body>
</html>
