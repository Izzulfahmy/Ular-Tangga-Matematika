<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IPAS Kelas 3 - Siklus Hidup yang Menakjubkan</title>
  
  <!-- Favicon Logo UNEJ -->
  <link rel="icon" type="image/png" href="aset/logo/unej.png" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* Reset & Core Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Background Gradient Ceria */
    body {
      background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 60%, #7dd3fc 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Outer Wrapper Latar Belakang Aset SVG */
    .nature-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    /* Keyframe Animasi Floating Ceria */
    @keyframes floatSoft {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    @keyframes flySoft {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(8px); }
      100% { transform: translateY(0px) translateX(0px); }
    }

    /* Positioning Aset Tumbuhan Latar */
    .bg-asset {
      position: absolute;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.08));
    }

    .pohon-kiri { left: -40px; bottom: 0; width: 220px; z-index: 1; }
    .pohon-kanan { right: -40px; bottom: 0; width: 240px; z-index: 1; }
    .rumput-bawah { bottom: -10px; left: 0; width: 100%; height: 80px; z-index: 2; object-fit: cover; }

    /* Positioning Aset Hewan */
    .animal {
      position: absolute;
      z-index: 3;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.12));
    }

    .capung { top: 18%; left: 8%; width: 65px; animation: flySoft 4s infinite ease-in-out; }
    .tawon { top: 15%; right: 10%; width: 60px; animation: flySoft 3.5s infinite ease-in-out 0.5s; }
    .burung { top: 8%; right: 25%; width: 75px; animation: flySoft 5s infinite ease-in-out 1s; }

    .gajah { bottom: 35px; left: 2%; width: 140px; animation: floatSoft 6s infinite ease-in-out; }
    .gorila { bottom: 40px; right: 2%; width: 120px; animation: floatSoft 5.5s infinite ease-in-out 0.3s; }
    .jerapah { bottom: 60px; right: 13%; width: 110px; animation: floatSoft 7s infinite ease-in-out 0.8s; }
    .anjing { bottom: 25px; left: 14%; width: 85px; animation: floatSoft 4.5s infinite ease-in-out 0.2s; }
    .landak { bottom: 15px; left: 24%; width: 55px; }
    .tikus { bottom: 15px; right: 25%; width: 45px; }

    /* Main Dashboard Layout Canvas */
    .dashboard-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      max-width: 1100px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    /* 1. Header Logo */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 28px;
      border-radius: 60px;
      border: 2px solid #ffffff;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.15);
    }

    .logo-img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    /* 2. Hero Content Area */
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      width: 100%;
    }

    .tag-subtitle {
      display: inline-flex;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: #0284c7;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #38bdf8;
      padding: 6px 20px;
      border-radius: 30px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    .main-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 16px;
      white-space: nowrap;
      width: 100%;
    }

    .main-title span {
      background: linear-gradient(135deg, #ff4757 0%, #ff6b81 40%, #ffa502 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
    }

    .badge-ppg {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      color: #b45309;
      border: 2px solid #fcd34d;
      padding: 8px 22px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.18);
    }

    .badge-ppg::before {
      content: "🎓";
    }

    /* 3. Navigation Menu Grid */
    .menu-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 540px;
      margin-bottom: 15px;
    }

    .menu-card {
      flex: 1;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08), inset 0 0 0 2px #ffffff;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .menu-card.materi { border-bottom: 5px solid #2563eb; }
    .menu-card.ular-tangga { border-bottom: 5px solid #059669; }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
    }

    .materi .icon-wrapper { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; }
    .ular-tangga .icon-wrapper { background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: #fff; }

    .card-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }

    .menu-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12);
    }

    /* Responsive Breakdown (Mobile Adjustments) */
    @media (max-width: 768px) {
      .main-title { white-space: normal; }
      .gajah { width: 90px; }
      .gorila { width: 80px; }
      .jerapah { width: 75px; right: 10%; }
      .pohon-kiri, .pohon-kanan { width: 140px; }
      .anjing, .landak, .tikus { display: none; } /* Sembunyikan hewan kecil di layar HP agar bersih */
    }
  </style>
</head>
<body>

  <!-- Latar Belakang Alam & Aset Hewan SVG -->
  <div class="nature-background">
    <!-- Tumbuhan -->
    <img src="aset/tumbuhan/pohon.svg" class="bg-asset pohon-kiri" alt="Pohon">
    <img src="aset/tumbuhan/pohon.svg" class="bg-asset pohon-kanan" alt="Pohon">
    <img src="aset/tumbuhan/rumput.svg" class="bg-asset rumput-bawah" alt="Rumput">

    <!-- Hewan Terbang -->
    <img src="aset/hewan/capung.svg" class="animal capung" alt="Capung">
    <img src="aset/hewan/tawon.svg" class="animal tawon" alt="Tawon">
    <img src="aset/hewan/burung.svg" class="animal burung" alt="Burung">

    <!-- Hewan Darat -->
    <img src="aset/hewan/gajah.svg" class="animal gajah" alt="Gajah">
    <img src="aset/hewan/anjing.svg" class="animal anjing" alt="Anjing">
    <img src="aset/hewan/landak.svg" class="animal landak" alt="Landak">
    <img src="aset/hewan/tikus.svg" class="animal tikus" alt="Tikus">
    <img src="aset/hewan/jerapah.svg" class="animal jerapah" alt="Jerapah">
    <img src="aset/hewan/gorila.svg" class="animal gorila" alt="Gorila">
  </div>

  <!-- Dashboard Container Utama -->
  <main class="dashboard-wrapper">
    
    <!-- 1. Top Header Logos -->
    <header class="logo-container">
      <img src="aset/logo/tutwuri.png" alt="Kemendikbud" class="logo-img">
      <img src="aset/logo/unej.png" alt="Universitas Jember" class="logo-img">
      <img src="aset/logo/ppg.png" alt="PPG" class="logo-img">
      <img src="aset/logo/fkip.png" alt="FKIP UNEJ" class="logo-img">
    </header>

    <!-- 2. Hero Title Central -->
    <section class="hero-section">
      <div class="tag-subtitle">Media Pembelajaran IPAS Kelas 3</div>
      <h1 class="main-title">
        <span>Siklus Hidup yang Menakjubkan</span>
      </h1>
      <div class="badge-ppg">
        PPG Calon Guru Gelombang 1 Tahun 2026
      </div>
    </section>

    <!-- 3. Bottom Menu Cards -->
    <nav class="menu-grid">
      <a href="materi/index.html" class="menu-card materi" onclick="playClickSound(event, this.href)">
        <div class="icon-wrapper">📚</div>
        <span class="card-label">Materi</span>
      </a>

      <a href="ulartangga.html" class="menu-card ular-tangga" onclick="playClickSound(event, this.href)">
        <div class="icon-wrapper">🎲</div>
        <span class="card-label">Ular Tangga</span>
      </a>
    </nav>

  </main>

  <!-- Sound Effects Script -->
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playPopSound() {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playClickSound(event, targetUrl) {
      event.preventDefault();
      playPopSound();
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 180);
    }
  </script>
</body>
</html>
