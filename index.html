<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IPAS Kelas 3 - Siklus Hidup yang Menakjubkan</title>
  
  <!-- Favicon Logo UNEJ -->
  <link rel="icon" type="image/png" href="aset/logo/unej.png" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Background dari Gambar Canva Anda */
    body {
      background: url('aset/gambar/bg-hewan.jpg') no-repeat center bottom / cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Overlay Halus Agar Teks Tetap Mudah Dibaca */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.15);
      z-index: 1;
    }

    .dashboard-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      max-width: 1000px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    /* Header Logo */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 28px;
      border-radius: 60px;
      border: 2px solid #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .logo-img {
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    /* Hero Section / Card Utama di Tengah */
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 24px 36px;
      border-radius: 32px;
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
      max-width: 750px;
      margin: auto 0;
    }

    .tag-subtitle {
      font-size: 0.95rem;
      font-weight: 800;
      color: #0284c7;
      background: #e0f2fe;
      border: 2px solid #38bdf8;
      padding: 6px 20px;
      border-radius: 30px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .main-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2rem, 3.8vw, 3rem);
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 14px;
      white-space: nowrap;
    }

    .main-title span {
      background: linear-gradient(135deg, #ff4757 0%, #ff6b81 40%, #ffa502 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
    }

    .badge-ppg {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fffbeb;
      color: #b45309;
      border: 2px solid #fcd34d;
      padding: 6px 20px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .badge-ppg::before {
      content: "🎓";
    }

    /* Menu Grid Tombol */
    .menu-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 15px;
    }

    .menu-card {
      flex: 1;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15), inset 0 0 0 2px #ffffff;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .menu-card.materi { border-bottom: 5px solid #2563eb; }
    .menu-card.ular-tangga { border-bottom: 5px solid #059669; }

    .icon-wrapper {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.9rem;
    }

    .materi .icon-wrapper { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; }
    .ular-tangga .icon-wrapper { background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: #fff; }

    .card-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }

    .menu-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 600px) {
      .main-title { white-space: normal; }
      .hero-section { padding: 18px 20px; }
    }
  </style>
</head>
<body>

  <main class="dashboard-wrapper">
    
    <!-- Logo Header -->
    <header class="logo-container">
      <img src="aset/logo/tutwuri.png" alt="Kemendikbud" class="logo-img">
      <img src="aset/logo/unej.png" alt="Universitas Jember" class="logo-img">
      <img src="aset/logo/ppg.png" alt="PPG" class="logo-img">
      <img src="aset/logo/fkip.png" alt="FKIP UNEJ" class="logo-img">
    </header>

    <!-- Judul Utama -->
    <section class="hero-section">
      <div class="tag-subtitle">Media Pembelajaran IPAS Kelas 3</div>
      <h1 class="main-title">
        <span>Siklus Hidup yang Menakjubkan</span>
      </h1>
      <div class="badge-ppg">
        PPG Calon Guru Gelombang 1 Tahun 2026
      </div>
    </section>

    <!-- Menu Tombol -->
    <nav class="menu-grid">
      <a href="materi/index.html" class="menu-card materi" onclick="playClickSound(event, this.href)">
        <div class="icon-wrapper">📚</div>
        <span class="card-label">Materi</span>
      </a>

      <a href="ulartangga.html" class="menu-card ular-tangga" onclick="playClickSound(event, this.href)">
        <div class="icon-wrapper">🎲</div>
        <span class="card-label">Ular Tangga</span>
      </a>
    </nav>

  </main>

  <!-- Audio Synthesizer -->
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playPopSound() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playClickSound(event, targetUrl) {
      event.preventDefault();
      playPopSound();
      setTimeout(() => { window.location.href = targetUrl; }, 180);
    }
  </script>
</body>
</html>
