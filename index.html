<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tarik Tambang Matematika - Media Pembelajaran</title>
  
  <!-- Font Playful & Ceria dari Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Core Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh; /* Support dynamic viewport height di mobile browser */
      overflow: hidden; /* Menjaga agar konten pas 1 layar */
      font-family: 'Fredoka', sans-serif;
    }

    /* Background Ceria Gradasi Dinamis */
    body {
      background: linear-gradient(135deg, #70e1f5 0%, #ffd194 50%, #ff9a9e 100%);
      background-size: 200% 200%;
      animation: gradientBG 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Elemen Dekorasi Latar Belakang Floating Bubble */
    .bg-bubbles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      opacity: 0.35;
      animation: floatUp 8s infinite ease-in-out;
    }

    .bubble:nth-child(1) { width: 80px; height: 80px; background: #FF6B6B; left: 10%; animation-duration: 7s; }
    .bubble:nth-child(2) { width: 120px; height: 120px; background: #4ECDC4; left: 85%; animation-duration: 9s; animation-delay: 1s; }
    .bubble:nth-child(3) { width: 60px; height: 60px; background: #FFE66D; left: 70%; animation-duration: 6s; animation-delay: 2s; }
    .bubble:nth-child(4) { width: 100px; height: 100px; background: #FF9F43; left: 20%; animation-duration: 10s; animation-delay: 0.5s; }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-40px) scale(1.1) rotate(15deg); }
    }

    /* Main Card Container */
    .dashboard-container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 680px;
      max-height: 94vh;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 
                  inset 0 0 0 4px rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 1. Header Logo Bar */
    .logo-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-bottom: 8px;
    }

    .logo-item {
      height: 52px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
      transition: transform 0.3s ease;
    }

    .logo-item:hover {
      transform: scale(1.15) rotate(5deg);
    }

    /* 2. Judul Section */
    .title-section {
      margin: 8px 0;
    }

    .sub-title {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #6c5ce7;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .main-title {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.15;
      background: linear-gradient(45deg, #ff007f, #ff9f43, #00b894, #0984e3);
      background-size: 300% 300%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowText 6s ease infinite;
      text-shadow: 0 10px 20px rgba(0,0,0,0.05);
      margin-bottom: 6px;
    }

    @keyframes rainbowText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .badge-ppg {
      display: inline-block;
      background: #ffeaa7;
      color: #d63031;
      border: 2px dashed #fdcb6e;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Quicksand', sans-serif;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    /* 3. Menu Navigation Cards */
    .menu-container {
      display: flex;
      gap: 16px;
      width: 100%;
      margin-top: 16px;
      justify-content: center;
    }

    .menu-card {
      flex: 1;
      max-width: 200px;
      background: #ffffff;
      text-decoration: none;
      border-radius: 24px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.08);
      border: 3px solid transparent;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    /* Variasi Warna Card 1: Materi */
    .menu-card.materi {
      border-color: #74b9ff;
      background: linear-gradient(180deg, #ffffff 60%, #e8f4fe 100%);
    }

    /* Variasi Warna Card 2: Ular Tangga */
    .menu-card.ular-tangga {
      border-color: #55efc4;
      background: linear-gradient(180deg, #ffffff 60%, #e6faf5 100%);
    }

    .icon-box {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      transition: transform 0.4s ease;
    }

    .materi .icon-box {
      background: #0984e3;
      color: white;
      box-shadow: 0 6px 12px rgba(9, 132, 227, 0.3);
    }

    .ular-tangga .icon-box {
      background: #00b894;
      color: white;
      box-shadow: 0 6px 12px rgba(0, 184, 148, 0.3);
    }

    .menu-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2d3436;
    }

    /* Hover & Active Effects */
    .menu-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 14px 25px rgba(0,0,0,0.15);
    }

    .menu-card:hover .icon-box {
      transform: rotate(12deg) scale(1.1);
    }

    .menu-card:active {
      transform: translateY(-2px) scale(0.98);
    }

    /* Responsif untuk Layar Kecil (Mobile) */
    @media (max-height: 650px) {
      .dashboard-container { padding: 16px 14px; }
      .logo-item { height: 40px; }
      .main-title { font-size: 1.7rem; }
      .sub-title { font-size: 0.9rem; }
      .badge-ppg { font-size: 0.8rem; padding: 4px 12px; }
      .icon-box { width: 50px; height: 50px; font-size: 1.5rem; }
      .menu-title { font-size: 1rem; }
      .menu-card { padding: 12px 8px; }
    }

    @media (max-width: 400px) {
      .logo-group { gap: 10px; }
      .logo-item { height: 36px; }
      .main-title { font-size: 1.5rem; }
      .menu-container { gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- Background Animated Bubbles -->
  <div class="bg-bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <!-- Main Container -->
  <div class="dashboard-container">
    
    <!-- 1. Header Logo Bar -->
    <header class="logo-group">
      <img src="aset/logo/tutwuri.png" alt="Tutwuri Handayani" class="logo-item" title="Kemendikbud">
      <img src="aset/logo/unej.png" alt="Universitas Jember" class="logo-item" title="UNEJ">
      <img src="aset/logo/ppg.png" alt="PPG" class="logo-item" title="PPG">
      <img src="aset/logo/fkip.png" alt="FKIP" class="logo-item" title="FKIP UNEJ">
    </header>

    <!-- 2. Judul Section -->
    <section class="title-section">
      <h2 class="sub-title">Media Pembelajaran</h2>
      <h1 class="main-title">Tarik Tambang<br>Matematika</h1>
      <div class="badge-ppg">
        PPG Calon Guru Gelombang 1 2026
      </div>
    </section>

    <!-- 3. Menu Navigasi -->
    <nav class="menu-container">
      <!-- Button Materi -->
      <a href="materi/index.html" class="menu-card materi" onclick="playClickSound(event, this.href)">
        <div class="icon-box">📚</div>
        <span class="menu-title">Materi</span>
      </a>

      <!-- Button Ular Tangga -->
      <a href="UT/index.html" class="menu-card ular-tangga" onclick="playClickSound(event, this.href)">
        <div class="icon-box">🎲</div>
        <span class="menu-title">Ular Tangga</span>
      </a>
    </nav>

  </div>

  <!-- Audio Synthesizer -->
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playPopSound() {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playClickSound(event, targetUrl) {
      event.preventDefault();
      playPopSound();
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 180);
    }

    document.querySelectorAll('.menu-card').forEach(card => {
      card.addEventListener('mouseenter', () => {
        initAudio();
        if (audioCtx && audioCtx.state === 'running') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        }
      });
    });
  </script>
</body>
</html>
