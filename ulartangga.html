    <style>
        /* STATIC LIGHT GRADIENT UNTUK PERFORMA RINGAN */
        .static-bg {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #f0fdfa 100%);
        }

        .board-wrapper {
            width: 100%;
            max-width: min(100vw - 16px, calc(100vh - 120px)); 
            position: relative;
            margin: auto;
        }

        .board-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            z-index: 10;
        }

        .cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            border-radius: 6px;
        }

        .cell-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.6rem;
            opacity: 0.7;
        }

        .quiz-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
        }

        @media (min-width: 640px) {
            .cell-number { font-size: 0.8rem; top: 4px; left: 6px; }
            .cell { border-radius: 12px; }
            .quiz-dot { width: 10px; height: 10px; top: 6px; right: 6px; }
        }

        .player-token {
            position: absolute;
            width: 6vmin;
            height: 6vmin;
            max-width: 40px;
            max-height: 40px;
            transform: translate(-50%, -80%); 
            transition: top 0.3s ease, left 0.3s ease;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            will-change: top, left;
        }

        .token-emoji {
            font-size: 4vmin;
            line-height: 1;
            position: relative;
            z-index: 2;
            margin-bottom: -10%; 
        }

        @media (min-width: 640px) {
            .token-emoji { font-size: 28px; }
        }

        .token-base {
            width: 80%;
            height: 30%;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.8);
            position: absolute;
            bottom: 0;
            z-index: 1;
        }

        .base-0 { background: #2563eb; } 
        .base-1 { background: #dc2626; } 
        .base-2 { background: #059669; } 
        .base-3 { background: #d97706; } 

        @keyframes jump-arc {
            0% { transform: translate(-50%, -80%) scale(1); z-index: 60; }
            50% { transform: translate(-50%, -150%) scale(1.2); z-index: 60; }
            100% { transform: translate(-50%, -80%) scale(1); z-index: 60; }
        }
        .jumping {
            animation: jump-arc 0.3s ease-in-out;
            z-index: 60 !important;
        }

        .toy-btn {
            transition: transform 0.1s;
        }
        .toy-btn:active {
            transform: translateY(2px);
        }
        .toy-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .card-active {
            transform: scale(1.02);
            opacity: 1 !important;
        }
        .card-inactive {
            transform: scale(0.98);
            opacity: 0.55;
        }

        .perspective-1000 { perspective: 1000px; }
        .dice-cube {
            width: 100px; 
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
        }
        .dice-face {
            position: absolute;
            width: 100%; 
            height: 100%;
            background: #ffffff;
            border: 3px solid #cbd5e1;
            border-radius: 16px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 12px;
            backface-visibility: hidden;
            justify-items: center;
            align-items: center;
        }
        .pip {
            width: 18px; 
            height: 18px;
            background: #334155;
            border-radius: 50%;
        }
        .face-1 { transform: translateZ(50px); }
        .face-1 .pip { grid-area: 2 / 2 / 3 / 3; background: #ef4444; width: 24px; height: 24px;}
        .face-2 { transform: rotateY(90deg) translateZ(50px); }
        .face-2 .pip:nth-child(1) { grid-area: 1 / 3 / 2 / 4; }
        .face-2 .pip:nth-child(2) { grid-area: 3 / 1 / 4 / 2; }
        .face-3 { transform: rotateX(90deg) translateZ(50px); }
        .face-3 .pip:nth-child(1) { grid-area: 1 / 3 / 2 / 4; }
        .face-3 .pip:nth-child(2) { grid-area: 2 / 2 / 3 / 3; }
        .face-3 .pip:nth-child(3) { grid-area: 3 / 1 / 4 / 2; }
        .face-4 { transform: rotateX(-90deg) translateZ(50px); }
        .face-4 .pip:nth-child(1) { grid-area: 1 / 1 / 2 / 2; }
        .face-4 .pip:nth-child(2) { grid-area: 1 / 3 / 2 / 4; }
        .face-4 .pip:nth-child(3) { grid-area: 3 / 1 / 4 / 2; }
        .face-4 .pip:nth-child(4) { grid-area: 3 / 3 / 4 / 4; }
        .face-5 { transform: rotateY(-90deg) translateZ(50px); }
        .face-5 .pip:nth-child(1) { grid-area: 1 / 1 / 2 / 2; }
        .face-5 .pip:nth-child(2) { grid-area: 1 / 3 / 2 / 4; }
        .face-5 .pip:nth-child(3) { grid-area: 2 / 2 / 3 / 3; }
        .face-5 .pip:nth-child(4) { grid-area: 3 / 1 / 4 / 2; }
        .face-5 .pip:nth-child(5) { grid-area: 3 / 3 / 4 / 4; }
        .face-6 { transform: rotateY(180deg) translateZ(50px); }
        .face-6 .pip:nth-child(1) { grid-area: 1 / 1 / 2 / 2; }
        .face-6 .pip:nth-child(2) { grid-area: 2 / 1 / 3 / 2; }
        .face-6 .pip:nth-child(3) { grid-area: 3 / 1 / 4 / 2; }
        .face-6 .pip:nth-child(4) { grid-area: 1 / 3 / 2 / 4; }
        .face-6 .pip:nth-child(5) { grid-area: 2 / 3 / 3 / 4; }
        .face-6 .pip:nth-child(6) { grid-area: 3 / 3 / 4 / 4; }

        /* MINI DICE PIP STYLE */
        .mini-dice-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            padding: 3px;
            justify-items: center;
            align-items: center;
        }
        .mini-pip {
            width: 6px;
            height: 6px;
            background-color: #334155;
            border-radius: 50%;
        }
        .mini-pip-red {
            width: 9px;
            height: 9px;
            background-color: #ef4444;
            border-radius: 50%;

        #dice-shadow {
            width: 80px; height: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
            bottom: -20px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>

        const playerColorClasses = ['text-blue-600', 'text-red-600', 'text-emerald-600', 'text-yellow-600'];
        const playerRingClasses = ['ring-blue-400', 'ring-red-400', 'ring-emerald-400', 'ring-yellow-400'];

        const posOffsets = [{ dx: -2, dy: -2 }, { dx: 2, dy: -2 }, { dx: -2, dy: 2 }, { dx: 2, dy: 2 }];

        let bankSoalGlobal = []; 
        let soalAktif = null;
        let petakKuisMap = {};

        document.addEventListener('DOMContentLoaded', () => {
            buildBoard();
            drawSnakesAndLadders();
            muatMasterDataFirebase();
        });

        async function muatMasterDataFirebase() {
            try {
                const querySnapshot = await window.fsGetDocs(window.fsCollection(window.dbFirestore, "ular_tangga"));
                bankSoalGlobal = [];
                querySnapshot.forEach((doc) => {
                    let d = doc.data(); d.id = doc.id;
                    if(d.soal && d.soal.trim() !== '') {
                        bankSoalGlobal.push(d);
                    }
                });
            } catch (err) {
                console.error("Gagal sinkron database:", err);
            }
        }

        function setPlayerCount(count) {
            tempPlayerCount = count;
            for(let i=1; i<=4; i++) {
                document.getElementById(`btn-pcount-${i}`).className = (i === count)
                    ? "py-3 bg-emerald-50 border-2 border-brand-500 text-brand-600 font-black rounded-xl text-base text-center shadow-sm"
                    : "py-3 bg-slate-50 border-2 border-slate-200 text-slate-600 font-black rounded-xl text-base text-center";
            }
        }

        function startGameDirectly() {
            numPlayers = tempPlayerCount;
            distribusikanKuisAcakPapan();
            executeStartGame();
        }

        function distribusikanKuisAcakPapan() {
            petakKuisMap = {};
            buildBoard(); 

            if (bankSoalGlobal.length === 0) return;

            let petakTersedia = [];
            for(let i = 2; i <= 98; i++) {
                if(!ladders[i] && !snakes[i]) {
                    petakTersedia.push(i);
                }
            }
            if(petakTersedia.length < bankSoalGlobal.length) {
                for(let i = 2; i <= 98; i++) {
                    if(!petakTersedia.includes(i)) petakTersedia.push(i);
                }
            }

            petakTersedia.sort(() => Math.random() - 0.5);

            bankSoalGlobal.forEach((soal, index) => {
                if (index < petakTersedia.length) {
                    let nomorPetakTerpilih = petakTersedia[index];
                    petakKuisMap[nomorPetakTerpilih] = soal;

                    const cellEl = document.getElementById(`cell-${nomorPetakTerpilih}`);
                    if(cellEl) {
                        const dot = document.createElement('div');
                        dot.className = "quiz-dot";
                        cellEl.appendChild(dot);
                    }
                }
            });
        }

        function executeStartGame() {
            currentPlayer = 0; 
            playerPositions = [1, 1, 1, 1]; 
            previousPositions = [1, 1, 1, 1];
            isMoving = false;
            document.getElementById('startup-modal').classList.add('hidden');
            for(let i=0; i<4; i++) {
                const token = document.getElementById(`player-token-${i}`);
                const card = document.getElementById(`card-p${i}`);
                if(i < numPlayers) {
                    token.classList.remove('hidden'); card.classList.remove('hidden'); card.classList.add('flex');
                    updatePlayerPosition(i, 1);
                } else {
                    token.classList.add('hidden'); card.classList.add('hidden');
                }
            }
            updateTurnUI();
        }

        function buildBoard() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';
            for (let row = 9; row >= 0; row--) {
                for (let col = 0; col < 10; col++) {
                    let num = (row % 2 === 0) ? (row * 10) + col + 1 : (row * 10) + (9 - col) + 1; 
                    const cell = document.createElement('div');
                    cell.id = `cell-${num}`; 
                    cell.className = `cell border-b border-r border-slate-300/60 ${cellColors[num % cellColors.length]}`;
                    cell.innerHTML = `<span class="cell-number">${num}</span>`;
                    grid.appendChild(cell);
                }
            }
        }

        function getCoordinates(num) {
            let row = Math.floor((num - 1) / 10);
            let col = (num - 1) % 10;
            if (row % 2 !== 0) col = 9 - col;
            let x = (col * 10) + 5; let y = 95 - (row * 10);
            return { x, y };
        }

        /* RENDERING TANGGA & ULAR TERKONTROL & PRESISI DENGAN PERBAIKAN KOORDINAT */
        function drawSnakesAndLadders() {
            const svg = document.getElementById('svg-layer');
            let svgContent = '';

            for (const [start, end] of Object.entries(ladders)) {
                const pos1 = getCoordinates(parseInt(start)); const pos2 = getCoordinates(end);
                const dx = pos2.x - pos1.x; const dy = pos2.y - pos1.y;
                const length = Math.sqrt(dx*dx + dy*dy);
                if (length === 0) continue;

                const px = -dy/length; const py = dx/length; const w = 1.6;
                const r1x1 = pos1.x + px*w; const r1y1 = pos1.y + py*w;
                const r1x2 = pos2.x + px*w; const r1y2 = pos2.y + py*w;
                const r2x1 = pos1.x - px*w; const r2y1 = pos1.y - py*w;
                const r2x2 = pos2.x - px*w; const r2y2 = pos2.y - py*w;

                // TIANG UTAMA TANGGA
                svgContent += `<line x1="${r1x1}" y1="${r1y1}" x2="${r1x2}" y2="${r1y2}" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/>`;
                svgContent += `<line x1="${r2x1}" y1="${r2y1}" x2="${r2x2}" y2="${r2y2}" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/>`;

                // ANAK TANGGA PRESISI
                const stepSize = 6.5;
                const rungCount = Math.floor(length / stepSize); 
                for(let i = 1; i <= rungCount; i++) {
                    const t = i / (rungCount + 1);
                    const rx1 = r1x1 + (r1x2 - r1x1)*t; 
                    const ry1 = r1y1 + (r1y2 - r1y1)*t;
                    const rx2 = r2x1 + (r2x2 - r2x1)*t; 
                    const ry2 = r2y1 + (r2y2 - r2y1)*t;
                    svgContent += `<line x1="${rx1}" y1="${ry1}" x2="${rx2}" y2="${ry2}" stroke="#a16207" stroke-width="0.9" stroke-linecap="round"/>`;
                }
            }

            const snakeColors = [{ body: '#ef4444', belly: '#fca5a5' }, { body: '#10b981', belly: '#6ee7b7' }, { body: '#3b82f6', belly: '#93c5fd' }, { body: '#8b5cf6', belly: '#c4b5fd' }];
            let sIdx = 0;
            for (const [head, tail] of Object.entries(snakes)) {
                const hPos = getCoordinates(parseInt(head)); const tPos = getCoordinates(tail);
                const dx = tPos.x - hPos.x; const dy = tPos.y - hPos.y;
                const length = Math.sqrt(dx*dx + dy*dy);
                const px = -dy/length; const py = dx/length;
                const curve = length > 30 ? 15 : 8; 
                const cx1 = hPos.x + dx*0.3 + px*curve; const cy1 = hPos.y + dy*0.3 + py*curve;
                const cx2 = hPos.x + dx*0.7 - px*curve; const cy2 = hPos.y + dy*0.7 - py*curve;

                const pathData = `M ${hPos.x} ${hPos.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${tPos.x} ${tPos.y}`;
                const col = snakeColors[sIdx % snakeColors.length]; sIdx++;

                svgContent += `<path d="${pathData}" stroke="${col.body}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
                svgContent += `<path d="${pathData}" stroke="${col.belly}" stroke-width="1.4" stroke-dasharray="1.2 2.5" fill="none" stroke-linecap="round"/>`;

                const hdx = hPos.x - cx1; const hdy = hPos.y - cy1;
                const hAngle = Math.atan2(hdy, hdx) * 180 / Math.PI;
                
                const tdx = tPos.x - cx2; const tdy = tPos.y - cy2;
                const tAngle = Math.atan2(tdy, tdx) * 180 / Math.PI;

                svgContent += `
                    <g transform="translate(${hPos.x}, ${hPos.y}) rotate(${hAngle})">
                        <ellipse cx="-1.2" cy="0" rx="3.2" ry="2.4" fill="${col.body}"/>
                        <circle cx="-0.4" cy="-1.1" r="0.7" fill="white"/><circle cx="-0.2" cy="-1.1" r="0.35" fill="black"/>
                        <circle cx="-0.4" cy="1.1" r="0.7" fill="white"/><circle cx="-0.2" cy="1.1" r="0.35" fill="black"/>
                        <path d="M 2 0 L 4 -0.6 M 2 0 L 4 0.6 M 2 0 L 3 0" stroke="#f43f5e" stroke-width="0.5" fill="none" stroke-linecap="round"/>
                    </g>
                    <g transform="translate(${tPos.x}, ${tPos.y}) rotate(${tAngle})">
                        <path d="M -2.5 -1.2 L 1.2 0 L -2.5 1.2 Z" fill="${col.body}"/>
                    </g>
                `;
            }
            svg.innerHTML = svgContent;
        }

        function updateTurnUI() {
            for (let i = 0; i < numPlayers; i++) {
                const card = document.getElementById(`card-p${i}`);
                if (card) {
                    if (i === currentPlayer) {
                        card.classList.add('card-active', 'ring-2', playerRingClasses[i]);
                        card.classList.remove('card-inactive');
                    } else {
                        card.classList.add('card-inactive');
                        card.classList.remove('card-active', 'ring-2', playerRingClasses[i]);
                    }
                }
            }
        }

        function updatePlayerPosition(pIndex, num) {
            const pos = getCoordinates(num);
            const token = document.getElementById(`player-token-${pIndex}`);
            token.classList.remove('jumping'); void token.offsetWidth; token.classList.add('jumping');
            const offset = posOffsets[pIndex];
            token.style.left = `calc(${pos.x}% + ${offset.dx}%)`;
            token.style.top = `calc(${pos.y}% + ${offset.dy}%)`;
            document.getElementById(`pos-p${pIndex}`).innerText = num;
        }

        function moveTokenStepByStep(pIndex, startPos, endPos, stepDelay, onComplete) {
            if (startPos === endPos) { if (onComplete) onComplete(); return; }
            let nextPos = (startPos < endPos) ? startPos + 1 : startPos - 1;
            playerPositions[pIndex] = nextPos;
            updatePlayerPosition(pIndex, nextPos);
            setTimeout(() => { moveTokenStepByStep(pIndex, nextPos, endPos, stepDelay, onComplete); }, stepDelay);
        }

        function renderMiniDicePip(val) {
            let pipsHTML = '';
            switch(val) {
                case 1:
                    pipsHTML = `<div class="col-start-2 row-start-2 mini-pip-red"></div>`; break;
                case 2:
                    pipsHTML = `<div class="col-start-3 row-start-1 mini-pip"></div><div class="col-start-1 row-start-3 mini-pip"></div>`; break;
                case 3:
                    pipsHTML = `<div class="col-start-3 row-start-1 mini-pip"></div><div class="col-start-2 row-start-2 mini-pip"></div><div class="col-start-1 row-start-3 mini-pip"></div>`; break;
                case 4:
                    pipsHTML = `<div class="col-start-1 row-start-1 mini-pip"></div><div class="col-start-3 row-start-1 mini-pip"></div><div class="col-start-1 row-start-3 mini-pip"></div><div class="col-start-3 row-start-3 mini-pip"></div>`; break;
                case 5:
                    pipsHTML = `<div class="col-start-1 row-start-1 mini-pip"></div><div class="col-start-3 row-start-1 mini-pip"></div><div class="col-start-2 row-start-2 mini-pip"></div><div class="col-start-1 row-start-3 mini-pip"></div><div class="col-start-3 row-start-3 mini-pip"></div>`; break;
                case 6:
                    pipsHTML = `<div class="col-start-1 row-start-1 mini-pip"></div><div class="col-start-3 row-start-1 mini-pip"></div><div class="col-start-1 row-start-2 mini-pip"></div><div class="col-start-3 row-start-2 mini-pip"></div><div class="col-start-1 row-start-3 mini-pip"></div><div class="col-start-3 row-start-3 mini-pip"></div>`; break;
            }
            return `<div class="mini-dice-grid">${pipsHTML}</div>`;
        }

        function rollDice3D() {
            if (isMoving) return; isMoving = true;
            document.getElementById('btn-roll').disabled = true;

            const overlay = document.getElementById('dice-3d-overlay'); const wrapper = document.getElementById('dice-wrapper');
            const cube = document.getElementById('dice-cube'); const shadow = document.getElementById('dice-shadow');
            const miniVisual = document.getElementById('mini-dice-visual');

            overlay.classList.remove('hidden'); void overlay.offsetWidth;
            overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100');

            wrapper.style.transition = 'none'; cube.style.transition = 'none'; shadow.style.transition = 'none';
            wrapper.style.transform = 'translate(-45vmin, 45vmin) scale(0.2)';
            cube.style.transform = 'rotateX(0deg) rotateY(0deg) rotateZ(0deg)';
            shadow.style.transform = 'scale(0.2)'; shadow.style.opacity = '0';

            const result = Math.floor(Math.random() * 6) + 1;
            let rotX = 0, rotY = 0;
            switch(result) {
                case 1: rotX = 0; rotY = 0; break;
                case 2: rotX = 0; rotY = -90; break;
                case 3: rotX = -90; rotY = 0; break;
                case 4: rotX = 90; rotY = 0; break;
                case 5: rotX = 0; rotY = 90; break;
                case 6: rotX = 180; rotY = 0; break;
            }

            setTimeout(() => {
                wrapper.style.transition = 'transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                wrapper.style.transform = 'translate(0, 0) scale(1)';
                cube.style.transition = 'transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1)';
                cube.style.transform = `rotateX(${rotX + 720}deg) rotateY(${rotY + 720}deg)`;
                shadow.style.transition = 'transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-in';
                shadow.style.transform = 'scale(1)'; shadow.style.opacity = '1';
                
                let blink = setInterval(() => {
                    miniVisual.innerHTML = renderMiniDicePip(Math.floor(Math.random()*6)+1);
                }, 100);

                setTimeout(() => {
                    clearInterval(blink); 
                    miniVisual.innerHTML = renderMiniDicePip(result);

                    setTimeout(() => {
                        overlay.classList.remove('opacity-100'); overlay.classList.add('opacity-0');
                        setTimeout(() => overlay.classList.add('hidden'), 200);

                        let cPos = playerPositions[currentPlayer]; 
                        previousPositions[currentPlayer] = cPos; 

                        let tPos = cPos + result;
                        if (tPos > 100) { setTimeout(nextTurn, 800); return; }
                        
                        moveTokenStepByStep(currentPlayer, cPos, tPos, 300, () => pemicuEvaluasiPetakLangkah(tPos));
                    }, 600);
                }, 900);
            }, 50);
        }

        function pemicuEvaluasiPetakLangkah(targetPos) {
            if(petakKuisMap[targetPos]) {
                soalAktif = petakKuisMap[targetPos];
                soalAktif.targetPos = targetPos;

                document.getElementById('quiz-player-tag').innerText = `Tantangan ${playerNames[currentPlayer]}`;
                document.getElementById('quiz-text').innerText = soalAktif.soal;
                document.getElementById('text-ans-a').innerText = soalAktif.a;
                document.getElementById('text-ans-b').innerText = soalAktif.b;
                document.getElementById('text-ans-c').innerText = soalAktif.c;
                document.getElementById('text-ans-d').innerText = soalAktif.d;

                document.getElementById('quiz-feedback').classList.add('hidden');
                ['a','b','c','d'].forEach(ch => {
                    const b = document.getElementById(`btn-ans-${ch}`);
                    b.className = "w-full py-2.5 px-3 sm:py-3 sm:px-4 bg-slate-50 hover:bg-blue-50 text-left rounded-xl sm:rounded-2xl border-2 border-slate-200 font-bold transition-all flex gap-2 sm:gap-3 text-xs sm:text-base";
                    b.disabled = false;
                });
                document.getElementById('quiz-modal').classList.remove('hidden');
            } else {
                checkSnakesLadders(currentPlayer, targetPos);
            }
        }

        function checkJawabanSiswa(jawaban) {
            const kunci = (soalAktif.kunci || 'A').toUpperCase(); 
            const feedback = document.getElementById('quiz-feedback');
            ['a','b','c','d'].forEach(ch => document.getElementById(`btn-ans-${ch}`).disabled = true);
            const btnT = document.getElementById(`btn-ans-${jawaban.toLowerCase()}`);

            if(jawaban === kunci) {
                btnT.className = "w-full py-2.5 px-3 sm:py-3 sm:px-4 bg-emerald-100 text-left rounded-xl sm:rounded-2xl border-2 border-emerald-400 font-bold text-emerald-700 flex gap-2 sm:gap-3 text-xs sm:text-base";
                feedback.innerHTML = "🎉 BENAR!"; feedback.className = "mt-3 text-center font-black text-xs sm:text-sm text-emerald-600 block";
                setTimeout(() => { document.getElementById('quiz-modal').classList.add('hidden'); checkSnakesLadders(currentPlayer, soalAktif.targetPos); }, 1200);
            } else {
                btnT.className = "w-full py-2.5 px-3 sm:py-3 sm:px-4 bg-rose-100 text-left rounded-xl sm:rounded-2xl border-2 border-rose-400 font-bold text-rose-700 flex gap-2 sm:gap-3 text-xs sm:text-base";
                if(document.getElementById(`btn-ans-${kunci.toLowerCase()}`)) {
                    document.getElementById(`btn-ans-${kunci.toLowerCase()}`).className = "w-full py-2.5 px-3 sm:py-3 sm:px-4 bg-emerald-50 text-left rounded-xl sm:rounded-2xl border-2 border-emerald-300 font-bold text-emerald-600 flex gap-2 sm:gap-3 text-xs sm:text-base";
                }
                
                let petakAsal = previousPositions[currentPlayer];
                feedback.innerHTML = `❌ SALAH! Kembali ke petak ${petakAsal}.`; 
                feedback.className = "mt-3 text-center font-black text-xs sm:text-sm text-rose-600 block";

                setTimeout(() => {
                    document.getElementById('quiz-modal').classList.add('hidden');
                    moveTokenStepByStep(currentPlayer, soalAktif.targetPos, petakAsal, 250, () => {
                        checkSnakesLadders(currentPlayer, petakAsal);
                    });
                }, 1800);
            }
        }

        function checkSnakesLadders(pIndex, pos) {
            if (pos === 100) { triggerWin(pIndex); return; }
            if (ladders[pos]) {
                playerPositions[pIndex] = ladders[pos]; updatePlayerPosition(pIndex, ladders[pos]); setTimeout(nextTurn, 1000);
            } else if (snakes[pos]) {
                playerPositions[pIndex] = snakes[pos]; updatePlayerPosition(pIndex, snakes[pos]); setTimeout(nextTurn, 1000);
            } else {
                setTimeout(nextTurn, 400);
            }
        }

        function nextTurn() {
            if(playerPositions.includes(100)) return;
            currentPlayer = (currentPlayer + 1) % numPlayers; updateTurnUI();
            isMoving = false; document.getElementById('btn-roll').disabled = false;
        }

        function triggerWin(pIndex) {
            const mc = document.getElementById('confetti-container'); const wm = document.getElementById('win-modal');
            document.getElementById('win-title').innerHTML = `${playerNames[pIndex]} MENANG!`;
            document.getElementById('win-title').className = `text-2xl sm:text-4xl font-black mb-2 ${playerColorClasses[pIndex]}`;
            document.getElementById('win-desc').innerHTML = `<b>${playerNames[pIndex]}</b> berhasil sampai petak 100!`;
            mc.classList.remove('hidden');
            setTimeout(() => { wm.classList.remove('scale-0'); wm.classList.add('scale-100'); }, 50);
        }

        function resetGame() {
            const mc = document.getElementById('confetti-container'); const wm = document.getElementById('win-modal');
            wm.classList.remove('scale-100'); wm.classList.add('scale-0');
            setTimeout(() => {
                mc.classList.add('hidden');
                document.getElementById('startup-modal').classList.remove('hidden');
                petakKuisMap = {};
                muatMasterDataFirebase();
            }, 300);
        }
    </script>
</body>
